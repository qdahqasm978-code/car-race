<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>🏎️ النجاة من التصادم</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0d0d0d;
    font-family:Arial,"Segoe UI",sans-serif;
    user-select:none;
    -webkit-user-select:none;
}

canvas{
    display:none;
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    touch-action:none;
}

.overlay-card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:92%;
    max-width:430px;
    max-height:94vh;

    overflow-y:auto;

    padding:18px;

    text-align:center;

    color:white;

    background:rgba(15,15,15,.97);

    border:2px solid #e74c3c;
    border-radius:15px;

    box-shadow:
        0 0 25px rgba(231,76,60,.4);

    z-index:20;
}

.lang-container{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:10px;
}

.lang-btn{
    padding:7px 14px;
    background:#222;
    color:white;
    border:1px solid #555;
    border-radius:7px;
    cursor:pointer;
    font-size:13px;
}

.lang-btn.active{
    background:#e74c3c;
    border-color:gold;
    font-weight:bold;
}

.money-badge{
    display:inline-block;

    margin:7px 0;

    padding:7px 15px;

    background:#27ae60;

    border:1px solid #2ecc71;

    border-radius:20px;

    font-weight:bold;
}

.menu-btn{
    margin:5px;

    padding:10px 18px;

    border:none;

    border-radius:8px;

    background:
        linear-gradient(
            45deg,
            #e74c3c,
            #c0392b
        );

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}

.menu-btn:active,
.car-btn:active,
.lang-btn:active{
    transform:scale(.96);
}

.car-shop{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

    margin:8px 0;
}

.car-btn{
    min-height:60px;

    padding:8px;

    border:1px solid #444;

    border-radius:8px;

    color:white;

    cursor:pointer;

    font-size:12px;

    font-weight:bold;

    white-space:pre-line;
}

.road-shop-box{
    margin:10px 0;

    padding:10px;

    background:#1a1a1a;

    border:1px dashed #f39c12;

    border-radius:10px;

    touch-action:pan-y;
}

.swipe-hint{
    margin-top:3px;

    color:#888;

    font-size:11px;
}

#startBtn{
    width:80%;
    margin-top:8px;
    font-size:17px;
}

#controlPanel{
    display:none;
}

</style>
</head>

<body>


<!-- =====================================================
     شاشة البداية
===================================================== -->

<div id="startScreen" class="overlay-card">

    <div class="lang-container">

        <button
            id="langAr"
            class="lang-btn active">
            🇸🇦 العربية
        </button>

        <button
            id="langEn"
            class="lang-btn">
            🇬🇧 English
        </button>

    </div>


    <h2 id="titleTxt">
        🏎️ النجاة من التصادم
    </h2>


    <div
        id="startMoneyTxt"
        class="money-badge">
        💰 النقود: $0
    </div>


    <!-- طرق -->

    <div
        id="roadShopBox"
        class="road-shop-box">

        <p
            id="selectRoadTxt"
            style="
                margin:0 0 6px;
                color:#f39c12;
                font-weight:bold;
                font-size:13px;
            ">
            🛤️ اختر الطريق:
        </p>


        <button
            id="roadBtn"
            class="menu-btn"
            style="
                width:85%;
                background:
                linear-gradient(
                    45deg,
                    #d35400,
                    #e67e22
                );
            ">
            🛣️ الطريق العادي
        </button>


        <div
            id="swipeHintTxt"
            class="swipe-hint">
            👈 اسحب للشمال لتغيير الطريق
        </div>

    </div>


    <!-- السيارات -->

    <p
        id="selectCarTxt"
        style="
            margin:5px;
            color:#aaa;
            font-size:13px;
        ">
        اختر أو اشترِ سيارتك:
    </p>


    <div class="car-shop">

        <button
            id="car2Btn"
            class="car-btn">
        </button>

        <button
            id="car32Btn"
            class="car-btn">
        </button>

        <button
            id="carExtraBtn"
            class="car-btn">
        </button>

        <button
            id="car50Btn"
            class="car-btn">
        </button>

    </div>


    <!-- الصعوبة -->

    <button
        id="easyBtn"
        class="menu-btn"
        style="border:2px solid gold;">
        😎 هجوم عادي
    </button>


    <button
        id="hardBtn"
        class="menu-btn">
        🔥 هجوم شرس
    </button>


    <br>

    <!-- زر شحن العملات -->
    <button
        id="cheatBtn"
        class="menu-btn"
        style="background: linear-gradient(45deg, #8e44ad, #9b59b6); border: 1px solid #be90d4; margin-top:6px;">
        🔑 شحن العملات
    </button>


    <br>


    <!-- بدء -->

    <button
        id="startBtn"
        class="menu-btn">
        ▶ بدء اللعب
    </button>

</div>



<!-- =====================================================
     اللعبة
===================================================== -->

<canvas id="gameCanvas"></canvas>



<!-- =====================================================
     لوحة التحكم
===================================================== -->

<div
    id="controlPanel"
    class="overlay-card">

    <button
        id="pauseBtn"
        class="menu-btn"
        style="width:100%;">
        ▶ استئناف
    </button>


    <button
        id="restartBtn"
        class="menu-btn"
        style="width:100%;">
        🔄 إعادة التشغيل
    </button>

</div>



<script>


/* =====================================================
   مراجع HTML
===================================================== */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


const startScreen =
    document.getElementById("startScreen");

const startBtn =
    document.getElementById("startBtn");


const controlPanel =
    document.getElementById("controlPanel");

const pauseBtn =
    document.getElementById("pauseBtn");

const restartBtn =
    document.getElementById("restartBtn");


const roadShopBox =
    document.getElementById("roadShopBox");

const roadBtn =
    document.getElementById("roadBtn");


const langAr =
    document.getElementById("langAr");

const langEn =
    document.getElementById("langEn");


const easyBtn =
    document.getElementById("easyBtn");

const hardBtn =
    document.getElementById("hardBtn");

const cheatBtn =
    document.getElementById("cheatBtn");


/* =====================================================
   مسارات الملفات
===================================================== */

const FILES = {

    car2:
        "car2.png",

    car32:
        "car32.png",

    carExtra:
        "carExtra.png",

    car50:
        "car50.png",

    road:
        "road.png",

    desert:
        "desert.png",

    snow:
        "snow.png",

    music:
        "background.mp3",

    crash:
        "explosion.mp3"

};


/* =====================================================
   اللغة
===================================================== */

let currentLang = "ar";


const i18n = {

    ar:{

        title:
            "🏎️ النجاة من التصادم",

        money:
            "💰 النقود: $",

        selectCar:
            "اختر أو اشترِ سيارتك:",

        selectRoad:
            "🛤️ اختر الطريق:",

        swipe:
            "👈 اسحب للشمال لتغيير الطريق",

        easy:
            "😎 هجوم عادي",

        hard:
            "🔥 هجوم شرس",

        cheat:
            "🔑 شحن العملات",

        start:
            "▶ بدء اللعب",

        resume:
            "▶ استئناف",

        pause:
            "⏸ إيقاف",

        restart:
            "🔄 إعادة التشغيل",

        selected:
            "✔ مختارة",

        select:
            "قيادة",

        roadSelected:
            "✔ مختار",

        roadSelect:
            "اختيار",

        score:
            "النقاط:",

        high:
            "أعلى نتيجة:",

        level:
            "المستوى:",

        crash:
            "💥 لقد اصطدمت!",

        need:
            "تحتاج إلى $",

        more:
            " إضافية!"

    },


    en:{

        title:
            "🏎️ Survive the Collision",

        money:
            "💰 Cash: $",

        selectCar:
            "Choose or Buy Your Car:",

        selectRoad:
            "🛤️ Choose Track:",

        swipe:
            "👉 Swipe right to change track",

        easy:
            "😎 Normal Attack",

        hard:
            "🔥 Aggressive",

        cheat:
            "🔑 Redeem Code",

        start:
            "▶ Start Game",

        resume:
            "▶ Resume",

        pause:
            "⏸ Pause",

        restart:
            "🔄 Restart",

        selected:
            "✔ Active",

        select:
            "Drive",

        roadSelected:
            "✔ Active",

        roadSelect:
            "Select",

        score:
            "Score:",

        high:
            "High Score:",

        level:
            "Level:",

        crash:
            "💥 You Crashed!",

        need:
            "You need $",

        more:
            " more!"

    }

};


/* =====================================================
   LocalStorage
===================================================== */

let highScore =
    Number(
        localStorage.getItem(
            "carRace_highScore"
        )
    ) || 0;


let money =
    Number(
        localStorage.getItem(
            "carRace_money"
        )
    ) || 0;


let unlockedCars;

try{

    unlockedCars =
        JSON.parse(
            localStorage.getItem(
                "carRace_unlockedCars"
            )
        ) || ["car2"];

}catch{

    unlockedCars =
        ["car2"];

}


let currentCar =
    localStorage.getItem(
        "carRace_currentCar"
    ) || "car2";


let unlockedRoads;

try{

    unlockedRoads =
        JSON.parse(
            localStorage.getItem(
                "carRace_unlockedRoads"
            )
        ) || ["road"];

}catch{

    unlockedRoads =
        ["road"];

}


let currentRoad =
    localStorage.getItem(
        "carRace_currentRoad"
    ) || "road";


/* =====================================================
   تحميل الصور
===================================================== */

function loadImage(src){

    const img =
        new Image();

    img.src = src;

    return img;

}


const carImg =
    loadImage(FILES.car2);

const car32Img =
    loadImage(FILES.car32);

const carExtraImg =
    loadImage(FILES.carExtra);

const car50Img =
    loadImage(FILES.car50);


const roadImg =
    loadImage(FILES.road);

const desertImg =
    loadImage(FILES.desert);

const snowImg =
    loadImage(FILES.snow);


/* =====================================================
   السيارات
===================================================== */

const allCars = [

    {
        id:"car2",

        img:carImg,

        color:"#e74c3c",

        price:0,

        nameAr:"🔴 الحمراء",

        nameEn:"🔴 Red"
    },


    {
        id:"car32",

        img:car32Img,

        color:"#3498db",

        price:100,

        nameAr:"🔵 الزرقاء",

        nameEn:"🔵 Blue"
    },


    {
        id:"carExtra",

        img:carExtraImg,

        color:"#2ecc71",

        price:250,

        nameAr:"🟢 الخضراء",

        nameEn:"🟢 Green"
    },


    {
        id:"car50",

        img:car50Img,

        color:"#34495e",

        price:500,

        nameAr:"⬛ السوداء",

        nameEn:"⬛ Black"
    }

];


/* =====================================================
   الطرق
===================================================== */

const allRoads = [

    {
        id:"road",

        img:roadImg,

        price:0,

        nameAr:"🛣️ الطريق العادي",

        nameEn:"🛣️ Default Road"
    },


    {
        id:"desert",

        img:desertImg,

        price:1000,

        nameAr:"🌵 الطريق الصحراوي",

        nameEn:"🌵 Desert Track"
    },


    {
        id:"snow",

        img:snowImg,

        price:2000,

        nameAr:"❄️ الطريق الثلجي",

        nameEn:"❄️ Snow Track"
    }

];


let currentRoadIndex =
    allRoads.findIndex(
        road => road.id === currentRoad
    );


if(currentRoadIndex < 0){

    currentRoadIndex = 0;

    currentRoad = "road";

}


/* =====================================================
   الصوت
===================================================== */

const bgMusic =
    new Audio(FILES.music);

bgMusic.loop = true;
bgMusic.volume = 0.4;


const crashSound =
    new Audio(FILES.crash);

crashSound.volume = 0.8;


/* =====================================================
   حالة اللعبة
===================================================== */

let difficulty = "easy";

let paused = false;

let gameOver = false;

let playerX = 0;

let playerY = 0;

let playerVx = 0;

let score = 0;

let level = 1;

let dodgedCars = 0;

let roadY = 0;

let coins = [];

let attackerCars = [];

let sparks = [];


const carWidth = 52;

const carHeight = 105;


/* =====================================================
   حجم Canvas
===================================================== */

function resizeCanvas(){

    canvas.width =
        Math.min(
            window.innerWidth,
            480
        );

    canvas.height =
        window.innerHeight;

}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =====================================================
   تحديث السيارات
===================================================== */

function updateCarButtons(){

    const t =
        i18n[currentLang];


    document.getElementById(
        "startMoneyTxt"
    ).innerText =
        t.money + money;


    allCars.forEach(car => {

        const btn =
            document.getElementById(
                car.id + "Btn"
            );


        const unlocked =
            unlockedCars.includes(
                car.id
            );


        const selected =
            currentCar === car.id;


        const name =
            currentLang === "ar"
            ? car.nameAr
            : car.nameEn;


        if(selected){

            btn.innerText =
                name +
                "\n(" +
                t.selected +
                ")";

            btn.style.background =
                "linear-gradient(45deg,#27ae60,#2ecc71)";

        }

        else if(unlocked){

            btn.innerText =
                name +
                "\n(" +
                t.select +
                ")";

            btn.style.background =
                "linear-gradient(45deg,#2980b9,#3498db)";

        }

        else{

            btn.innerText =
                name +
                "\n🔒 $" +
                car.price;

            btn.style.background =
                "linear-gradient(45deg,#7f8c8d,#95a5a6)";

        }

    });

}


/* =====================================================
   شراء / اختيار سيارة
===================================================== */

function handleCarClick(id){

    const car =
        allCars.find(
            item => item.id === id
        );


    if(!car)
        return;


    if(
        unlockedCars.includes(id)
    ){

        currentCar = id;

        localStorage.setItem(
            "carRace_currentCar",
            currentCar
        );

    }

    else{

        if(
            money < car.price
        ){

            alert(
                i18n[currentLang].need +
                (car.price - money) +
                i18n[currentLang].more
            );

            return;

        }


        money -= car.price;

        unlockedCars.push(id);

        currentCar = id;


        localStorage.setItem(
            "carRace_money",
            money
        );


        localStorage.setItem(
            "carRace_unlockedCars",
            JSON.stringify(
                unlockedCars
            )
        );


        localStorage.setItem(
            "carRace_currentCar",
            currentCar
        );

    }


    updateCarButtons();

}


allCars.forEach(car => {

    document.getElementById(
        car.id + "Btn"
    ).onclick = function(){

        handleCarClick(
            car.id
        );

    };

});


/* =====================================================
   تحديث الطرق
===================================================== */

function updateRoadUI(){

    const t =
        i18n[currentLang];


    const road =
        allRoads[
            currentRoadIndex
        ];


    const unlocked =
        unlockedRoads.includes(
            road.id
        );


    const selected =
        currentRoad === road.id;


    const name =
        currentLang === "ar"
        ? road.nameAr
        : road.nameEn;


    if(selected){

        roadBtn.innerText =
            name +
            " (" +
            t.roadSelected +
            ")";

        roadBtn.style.background =
            "linear-gradient(45deg,#27ae60,#2ecc71)";

    }

    else if(unlocked){

        roadBtn.innerText =
            name +
            " (" +
            t.roadSelect +
            ")";

        roadBtn.style.background =
            "linear-gradient(45deg,#2980b9,#3498db)";

    }

    else{

        roadBtn.innerText =
            name +
            " 🔒 $" +
            road.price;

        roadBtn.style.background =
            "linear-gradient(45deg,#d35400,#e67e22)";

    }

}


/* =====================================================
   اختيار / شراء الطريق
===================================================== */

roadBtn.onclick = function(){

    const road =
        allRoads[
            currentRoadIndex
        ];


    if(
        unlockedRoads.includes(
            road.id
        )
    ){

        currentRoad =
            road.id;

        localStorage.setItem(
            "carRace_currentRoad",
            currentRoad
        );

    }

    else{

        if(
            money < road.price
        ){

            alert(
                i18n[currentLang].need +
                (road.price - money) +
                i18n[currentLang].more
            );

            return;

        }


        money -= road.price;

        unlockedRoads.push(
            road.id
        );

        currentRoad =
            road.id;


        localStorage.setItem(
            "carRace_money",
            money
        );


        localStorage.setItem(
            "carRace_unlockedRoads",
            JSON.stringify(
                unlockedRoads
            )
        );


        localStorage.setItem(
            "carRace_currentRoad",
            currentRoad
        );

    }


    updateCarButtons();

    updateRoadUI();

};


/* =====================================================
   Swipe للطرق
===================================================== */

let touchStartX = 0;


roadShopBox.addEventListener(
    "touchstart",
    function(e){

        touchStartX =
            e.touches[0].clientX;

    },
    {passive:true}
);


roadShopBox.addEventListener(
    "touchend",
    function(e){

        const touchEndX =
            e.changedTouches[0].clientX;


        const diff =
            touchEndX -
            touchStartX;


        if(
            Math.abs(diff) < 30
        )
            return;


        if(
            currentLang === "ar"
        ){

            if(diff < 0){

                currentRoadIndex =
                    (
                        currentRoadIndex + 1
                    ) %
                    allRoads.length;

            }

            else{

                currentRoadIndex =
                    (
                        currentRoadIndex -
                        1 +
                        allRoads.length
                    ) %
                    allRoads.length;

            }

        }

        else{

            if(diff > 0){

                currentRoadIndex =
                    (
                        currentRoadIndex + 1
                    ) %
                    allRoads.length;

            }

            else{

                currentRoadIndex =
                    (
                        currentRoadIndex -
                        1 +
                        allRoads.length
                    ) %
                    allRoads.length;

            }

        }


        updateRoadUI();

    },
    {passive:true}
);


/* =====================================================
   تغيير اللغة
===================================================== */

function setLanguage(lang){

    currentLang = lang;


    document.documentElement.lang =
        lang;

    document.documentElement.dir =
        lang === "ar"
        ? "rtl"
        : "ltr";


    langAr.classList.toggle(
        "active",
        lang === "ar"
    );


    langEn.classList.toggle(
        "active",
        lang === "en"
    );


    const t =
        i18n[lang];


    document.getElementById(
        "titleTxt"
    ).innerText =
        t.title;


    document.getElementById(
        "selectCarTxt"
    ).innerText =
        t.selectCar;


    document.getElementById(
        "selectRoadTxt"
    ).innerText =
        t.selectRoad;


    document.getElementById(
        "swipeHintTxt"
    ).innerText =
        t.swipe;


    easyBtn.innerText =
        t.easy;


    hardBtn.innerText =
        t.hard;


    cheatBtn.innerText =
        t.cheat;


    startBtn.innerText =
        t.start;


    pauseBtn.innerText =
        t.resume;


    restartBtn.innerText =
        t.restart;


    updateCarButtons();

    updateRoadUI();

}


langAr.onclick =
    () => setLanguage("ar");


langEn.onclick =
    () => setLanguage("en");


/* =====================================================
   اختيار الصعوبة
===================================================== */

easyBtn.onclick =
    function(){

        difficulty = "easy";

        easyBtn.style.border =
            "2px solid gold";

        hardBtn.style.border =
            "none";

    };


hardBtn.onclick =
    function(){

        difficulty = "hard";

        hardBtn.style.border =
            "2px solid gold";

        easyBtn.style.border =
            "none";

    };


/* =====================================================
   شحن العملات بكلمة السر jfjf747g
===================================================== */

cheatBtn.onclick = function(){

    const pass = prompt(
        currentLang === "ar"
        ? "أدخل كلمة السر لشحن العملات:"
        : "Enter cheat code to add cash:"
    );

    if(pass === "jfjf747g"){

        money += 5000;

        localStorage.setItem("carRace_money", money);

        updateCarButtons();

        alert(
            currentLang === "ar"
            ? "🎉 تم شحن 5000$ بنجاح!"
            : "🎉 $5000 added successfully!"
        );

    }else if(pass !== null){

        alert(
            currentLang === "ar"
            ? "❌ كلمة السر غير صحيحة!"
            : "❌ Invalid code!"
        );

    }

};


/* =====================================================
   رسم سيارة احتياطية
===================================================== */

function drawFallbackCar(
    w,
    h,
    color
){

    ctx.fillStyle =
        color;


    ctx.beginPath();

    ctx.roundRect(
        -w / 2,
        -h / 2,
        w,
        h,
        8
    );

    ctx.fill();


    ctx.fillStyle =
        "#87CEEB";


    ctx.fillRect(
        -w / 2 + 5,
        -h / 4,
        w - 10,
        h / 4
    );


    ctx.fillStyle =
        "#111";


    ctx.fillRect(
        -w / 2 - 3,
        -h / 3,
        4,
        18
    );


    ctx.fillRect(
        w / 2 - 1,
        -h / 3,
        4,
        18
    );


    ctx.fillRect(
        -w / 2 - 3,
        h / 4,
        4,
        18
    );


    ctx.fillRect(
        w / 2 - 1,
        h / 4,
        4,
        18
    );

}


/* =====================================================
   رسم السيارة
===================================================== */

function renderCar(
    img,
    x,
    y,
    w,
    h,
    color,
    isPlayer,
    tilt
){

    ctx.save();


    ctx.translate(
        x + w / 2,
        y + h / 2
    );


    let rotation =
        isPlayer
        ? 0
        : Math.PI;


    rotation +=
        tilt * .03;


    ctx.rotate(
        rotation
    );


    if(
        img.complete &&
        img.naturalWidth > 0
    ){

        ctx.drawImage(
            img,
            -w / 2,
            -h / 2,
            w,
            h
        );

    }

    else{

        drawFallbackCar(
            w,
            h,
            color
        );

    }


    ctx.restore();

}


/* =====================================================
   Hitbox (تم تصغير منطقة التصادم بنسبة 10%)
===================================================== */

function getHitbox(
    x,
    y,
    w,
    h
){

    const insetX =
        w * .22;

    const insetY =
        h * .12;

    const origW =
        w - insetX * 2;

    const origH =
        h - insetY * 2;

    // تقليل الأبعاد 10%
    const boxW =
        origW * 0.90;

    const boxH =
        origH * 0.90;


    return {

        x:
            x + insetX + (origW - boxW) / 2,

        y:
            y + insetY + (origH - boxH) / 2,

        w:
            boxW,

        h:
            boxH

    };

}


function collision(a,b){

    return (

        a.x <
        b.x + b.w &&

        a.x + a.w >
        b.x &&

        a.y <
        b.y + b.h &&

        a.y + a.h >
        b.y

    );

}


/* =====================================================
   ذكاء السيارات
===================================================== */

class SmartAICar{

    constructor(model){

        this.model =
            model;

        this.w =
            carWidth;

        this.h =
            carHeight;

        this.reset();

    }


    reset(){

        this.x =
            Math.random() *
            (
                canvas.width -
                this.w
            );


        this.y =
            -this.h -
            Math.random() * 400;


        this.baseSpeed =
            (
                difficulty === "easy"
                ? 3.5
                : 5.2
            )
            +
            Math.random() * 1.5;


        this.steeringPower =
            difficulty === "easy"
            ? .025
            : .05;


        this.vx = 0;

    }


    update(){

        const distanceY =
            playerY -
            this.y;


        if(
            distanceY > 0 &&
            distanceY <
            canvas.height * .75
        ){

            const diffX =
                playerX -
                this.x;


            this.vx +=
                (
                    diffX *
                    this.steeringPower -
                    this.vx
                ) * .1;

        }

        else{

            this.vx *= .9;

        }


        this.x +=
            this.vx;


        this.y +=
            this.baseSpeed +
            level * .4;


        this.x =
            Math.max(
                5,
                Math.min(
                    canvas.width -
                    this.w -
                    5,
                    this.x
                )
            );


        if(
            this.y >
            canvas.height + 60
        ){

            this.reset();

            score++;

            dodgedCars++;

            level =
                Math.floor(
                    dodgedCars / 7
                ) + 1;

        }

    }

}


/* =====================================================
   إنشاء السيارات
===================================================== */

function setupAttackers(){

    attackerCars = [];


    const opponents =
        allCars.filter(
            car =>
                car.id !== currentCar
        );


    const count =
        difficulty === "easy"
        ? 2
        : 3;


    for(
        let i=0;
        i<count;
        i++
    ){

        attackerCars.push(
            new SmartAICar(
                opponents[
                    i % opponents.length
                ]
            )
        );

    }

}


/* =====================================================
   العملات
===================================================== */

function spawnCoin(){

    if(
        Math.random() < .02 &&
        coins.length < 3
    ){

        coins.push({

            x:
                Math.random() *
                (
                    canvas.width - 40
                ) + 20,

            y:-40,

            value:10,

            size:24

        });

    }

}


/* =====================================================
   الشرارات
===================================================== */

function createSparks(x,y){

    for(
        let i=0;
        i<35;
        i++
    ){

        sparks.push({

            x:x,

            y:y,

            vx:
                (
                    Math.random() -
                    .5
                ) * 16,

            vy:
                (
                    Math.random() -
                    .5
                ) * 16,

            size:
                Math.random() * 5 + 2,

            life:1

        });

    }

}


/* =====================================================
   إعادة اللعبة
===================================================== */

function resetGame(){

    resizeCanvas();


    playerX =
        canvas.width / 2 -
        carWidth / 2;


    playerY =
        canvas.height -
        carHeight -
        30;


    playerVx = 0;


    roadY = 0;

    score = 0;

    level = 1;

    dodgedCars = 0;


    coins = [];

    sparks = [];


    gameOver = false;

    paused = false;


    controlPanel.style.display =
        "none";


    setupAttackers();

}


/* =====================================================
   رسم اللعبة
===================================================== */

function drawGame(){

    if(
        gameOver ||
        paused
    )
        return;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const roadSpeed =
        (
            difficulty === "easy"
            ? 6
            : 8
        ) + level;


    roadY =
        (
            roadY +
            roadSpeed
        ) %
        canvas.height;


    /* الطريق */

    const activeRoad =
        allRoads.find(
            road =>
                road.id === currentRoad
        ) ||
        allRoads[0];


    const roadImage =
        activeRoad.img;


    if(
        roadImage.complete &&
        roadImage.naturalWidth > 0
    ){

        ctx.drawImage(
            roadImage,
            0,
            roadY,
            canvas.width,
            canvas.height
        );


        ctx.drawImage(
            roadImage,
            0,
            roadY -
            canvas.height,
            canvas.width,
            canvas.height
        );

    }

    else{

        ctx.fillStyle =
            currentRoad === "desert"
            ? "#c87520"
            : currentRoad === "snow"
            ? "#9eb5c7"
            : "#333";


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle =
            "#f1c40f";


        for(
            let y=-canvas.height;
            y<canvas.height;
            y+=70
        ){

            ctx.fillRect(
                canvas.width / 2 - 3,
                y + (roadY % 70),
                6,
                35
            );

        }

    }


    /* العملات */

    spawnCoin();


    for(
        let i=coins.length-1;
        i>=0;
        i--
    ){

        const coin =
            coins[i];


        coin.y +=
            roadSpeed;


        ctx.beginPath();

        ctx.arc(
            coin.x,
            coin.y,
            coin.size / 2,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "#f39c12";

        ctx.fill();


        ctx.strokeStyle =
            "#fff";

        ctx.lineWidth = 2;

        ctx.stroke();


        ctx.fillStyle =
            "#fff";

        ctx.font =
            "bold 12px Arial";

        ctx.textAlign =
            "center";


        ctx.fillText(
            "$",
            coin.x,
            coin.y + 4
        );


        if(

            Math.hypot(

                playerX +
                carWidth / 2 -
                coin.x,

                playerY +
                carHeight / 2 -
                coin.y

            )

            <

            carWidth / 2 +
            coin.size / 2

        ){

            money +=
                coin.value;


            score += 5;


            localStorage.setItem(
                "carRace_money",
                money
            );


            coins.splice(
                i,
                1
            );

        }


        else if(
            coin.y >
            canvas.height + 20
        ){

            coins.splice(
                i,
                1
            );

        }

    }


    /* اللاعب */

    const playerModel =
        allCars.find(
            car =>
                car.id === currentCar
        ) ||
        allCars[0];


    renderCar(

        playerModel.img,

        playerX,

        playerY,

        carWidth,

        carHeight,

        playerModel.color,

        true,

        playerVx

    );


    const playerBox =
        getHitbox(
            playerX,
            playerY,
            carWidth,
            carHeight
        );


    /* الخصوم */

    for(
        const attacker
        of attackerCars
    ){

        attacker.update();


        renderCar(

            attacker.model.img,

            attacker.x,

            attacker.y,

            attacker.w,

            attacker.h,

            attacker.model.color,

            false,

            attacker.vx

        );


        const enemyBox =
            getHitbox(

                attacker.x,

                attacker.y,

                attacker.w,

                attacker.h

            );


        if(
            collision(
                playerBox,
                enemyBox
            )
        ){

            createSparks(

                (
                    playerBox.x +
                    enemyBox.x
                ) / 2,

                (
                    playerBox.y +
                    enemyBox.y
                ) / 2

            );


            endGame();

            return;

        }

    }


    /* الشرارات */

    for(
        let i=sparks.length-1;
        i>=0;
        i--
    ){

        const spark =
            sparks[i];


        ctx.fillStyle =
            `rgba(
                255,
                ${Math.floor(
                    spark.life * 255
                )},
                0,
                ${spark.life}
            )`;


        ctx.beginPath();

        ctx.arc(
            spark.x,
            spark.y,
            spark.size,
            0,
            Math.PI * 2
        );

        ctx.fill();


        spark.x +=
            spark.vx;

        spark.y +=
            spark.vy;

        spark.life -=
            .05;


        if(
            spark.life <= 0
        ){

            sparks.splice(
                i,
                1
            );

        }

    }


    /* المعلومات */

    const t =
        i18n[currentLang];


    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 15px Arial";


    if(
        currentLang === "ar"
    ){

        ctx.textAlign =
            "right";


        ctx.fillText(
            t.money + money,
            canvas.width - 15,
            30
        );


        ctx.fillText(
            t.score + " " + score,
            canvas.width - 15,
            55
        );


        ctx.fillText(
            t.high + " " + highScore,
            canvas.width - 15,
            80
        );


        ctx.fillText(
            t.level + " " + level,
            canvas.width - 15,
            105
        );

    }

    else{

        ctx.textAlign =
            "left";


        ctx.fillText(
            t.money + money,
            15,
            30
        );


        ctx.fillText(
            t.score + " " + score,
            15,
            55
        );


        ctx.fillText(
            t.high + " " + highScore,
            15,
            80
        );


        ctx.fillText(
            t.level + " " + level,
            15,
            105
        );

    }


    requestAnimationFrame(
        drawGame
    );

}


/* =====================================================
   نهاية اللعبة
===================================================== */

function endGame(){

    if(gameOver)
        return;


    gameOver = true;


    bgMusic.pause();


    crashSound.currentTime = 0;


    crashSound.play()
        .catch(
            () => {}
        );


    if(
        score > highScore
    ){

        highScore =
            score;


        localStorage.setItem(
            "carRace_highScore",
            highScore
        );

    }


    setTimeout(
        function(){

            const t =
                i18n[currentLang];


            alert(

                t.crash +

                "\n" +

                t.score +
                " " +
                score +

                "\n" +

                t.money +
                money +

                "\n" +

                t.high +
                " " +
                highScore

            );


            startScreen.style.display =
                "block";


            canvas.style.display =
                "none";


            updateCarButtons();

            updateRoadUI();

        },
        300
    );

}


/* =====================================================
   لوحة المفاتيح
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            gameOver ||
            paused
        )
            return;


        const step = 22;


        if(
            e.key === "ArrowLeft"
        ){

            playerX -= step;

            playerVx = -5;

        }


        if(
            e.key === "ArrowRight"
        ){

            playerX += step;

            playerVx = 5;

        }


        if(
            e.key === "ArrowUp"
        ){

            playerY -= step;

        }


        if(
            e.key === "ArrowDown"
        ){

            playerY += step;

        }


        playerX =
            Math.max(
                0,
                Math.min(
                    canvas.width -
                    carWidth,
                    playerX
                )
            );


        playerY =
            Math.max(
                0,
                Math.min(
                    canvas.height -
                    carHeight,
                    playerY
                )
            );

    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(
            e.key === "ArrowLeft" ||
            e.key === "ArrowRight"
        ){

            playerVx = 0;

        }

    }
);


/* =====================================================
   التحكم باللمس
===================================================== */

function movePlayerTouch(e){

    if(
        gameOver ||
        paused
    )
        return;


    const touch =
        e.touches[0];


    const rect =
        canvas.getBoundingClientRect();


    let targetX =
        touch.clientX -
        rect.left -
        carWidth / 2;


    let targetY =
        touch.clientY -
        rect.top -
        carHeight / 2;


    playerVx =
        targetX -
        playerX;


    playerX =
        Math.max(
            0,
            Math.min(
                canvas.width -
                carWidth,
                targetX
            )
        );


    playerY =
        Math.max(
            0,
            Math.min(
                canvas.height -
                carHeight,
                targetY
            )
        );

}


canvas.addEventListener(
    "touchstart",
    movePlayerTouch,
    {passive:true}
);


canvas.addEventListener(
    "touchmove",
    function(e){

        movePlayerTouch(e);

        e.preventDefault();

    },
    {passive:false}
);


canvas.addEventListener(
    "touchend",
    function(){

        playerVx = 0;

    }
);


/* =====================================================
   إيقاف / استئناف
===================================================== */

function togglePause(){

    if(gameOver)
        return;


    paused =
        !paused;


    if(paused){

        bgMusic.pause();


        pauseBtn.innerText =
            i18n[currentLang].resume;


        controlPanel.style.display =
            "block";

    }

    else{

        controlPanel.style.display =
            "none";


        pauseBtn.innerText =
            i18n[currentLang].pause;


        bgMusic.play()
            .catch(
                () => {}
            );


        drawGame();

    }

}


pauseBtn.onclick =
    togglePause;


/* =====================================================
   إعادة التشغيل
===================================================== */

restartBtn.onclick =
    function(){

        resetGame();


        bgMusic.currentTime = 0;


        bgMusic.play()
            .catch(
                () => {}
            );


        drawGame();

    };


/* =====================================================
   بدء اللعبة
===================================================== */

startBtn.onclick =
    function(){

        startScreen.style.display =
            "none";


        canvas.style.display =
            "block";


        resetGame();


        bgMusic.currentTime = 0;


        bgMusic.play()
            .catch(
                () => {}
            );


        drawGame();

    };


/* =====================================================
   تشغيل أولي
===================================================== */

setLanguage("ar");

updateCarButtons();

updateRoadUI();

</script>
