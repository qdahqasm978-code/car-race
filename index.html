<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏎️ Car Race Game Deluxe</title>
  <style>
    body { background-color: black; margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: none; background-color: #333; border: 2px solid white; width: 100vw; height: 100vh; }
    
    #startScreen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; width: 90%; z-index: 30; }
    .lang-container { margin-bottom: 20px; display: flex; justify-content: center; gap: 15px; }
    .lang-select-btn { padding: 10px 20px; font-size: 16px; background: #333; color: white; border: 2px solid white; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .lang-select-btn.active { background: #ff0000; border-color: gold; font-weight: bold; }

    button { margin: 8px; padding: 12px 24px; font-size: 18px; background: linear-gradient(45deg, #ff0000, #cc0000); color: white; border: none; cursor: pointer; border-radius: 10px; transition: 0.2s; }
    button:active { transform: scale(0.95); }
    
    #controlPanel { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.92); padding: 20px; border-radius: 15px; box-shadow: 0 0 25px rgba(255,0,0,0.6); z-index: 20; min-width: 260px; }
    #controlPanel button { display: block; margin: 10px auto; width: 100%; max-width: 220px; }
  </style>
</head>
<body>

  <div id="startScreen">
    <div class="lang-container">
      <button id="langAr" class="lang-select-btn active">🇸🇦 العربية</button>
      <button id="langEn" class="lang-select-btn">🇬🇧 English</button>
    </div>

    <h1 id="titleTxt">🏎️ لعبة سباق السيارات Pro</h1>
    <p id="subTitleTxt">اختر مستوى الصعوبة ثم اضغط تشغيل</p>
    <button id="easyBtn" style="border: 2px solid gold;">😎 سهل</button>
    <button id="hardBtn">🔥 صعب</button>
    <br><br>
    <button id="startBtn">▶ بدء اللعب</button>
  </div>

  <canvas id="gameCanvas"></canvas>
  
  <div id="controlPanel">
    <button id="pauseBtn">⏸ استئناف</button>
    <button id="restartBtn">🔄 إعادة التشغيل</button>
    <hr style="border-color: #555; margin: 15px 0;">
    <p id="selectCarTxt" style="color: white; margin: 5px 0; font-size: 16px;">اختر سيارتك:</p>
    <button id="car2Btn" style="font-size: 15px; padding: 10px;">🔴 السيارة الحمراء</button>
    <button id="car32Btn" style="font-size: 15px; padding: 10px;">🔵 السيارة الزرقاء</button>
    <button id="carExtraBtn" style="font-size: 15px; padding: 10px;">🟢 السيارة الخضراء</button>
    <button id="car50Btn" style="font-size: 15px; padding: 10px;">⬛ السيارة السوداء</button>
  </div>
  
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");
    const controlPanel = document.getElementById("controlPanel");
    const restartBtn = document.getElementById("restartBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    
    const easyBtn = document.getElementById("easyBtn");
    const hardBtn = document.getElementById("hardBtn");

    const car2Btn = document.getElementById("car2Btn");
    const car32Btn = document.getElementById("car32Btn");
    const carExtraBtn = document.getElementById("carExtraBtn");
    const car50Btn = document.getElementById("car50Btn");

    const langAr = document.getElementById("langAr");
    const langEn = document.getElementById("langEn");

    let currentLang = "ar";
    let highScore = localStorage.getItem("carRace_highScore") || 0;

    const i18n = {
      ar: {
        title: "🏎️ لعبة سباق السيارات Pro",
        subtitle: "اختر لغتك ومستوى الصعوبة ثم اضغط بدء",
        easy: "😎 سهل", hard: "🔥 صعب", start: "▶ بدء اللعب",
        resume: "⏸ استئناف", restart: "🔄 إعادة التشغيل",
        selectCar: "اختر سيارتك:", carRed: "🔴 السيارة الحمراء",
        carBlue: "🔵 السيارة الزرقاء", carGreen: "🟢 السيارة الخضراء",
        carBlack: "⬛ السيارة السوداء", score: "النقاط: ",
        highScore: "أعلى نتيجة: ", level: "المستوى: ",
        gameOver: "💥 انتهت اللعبة!\nالنقاط: "
      },
      en: {
        title: "🏎️ Car Race Game Pro",
        subtitle: "Choose language & difficulty, then press Start",
        easy: "😎 Easy", hard: "🔥 Hard", start: "▶ Start",
        resume: "⏸ Resume", restart: "🔄 Restart",
        selectCar: "Choose Your Car:", carRed: "🔴 Red Car",
        carBlue: "🔵 Blue Car", carGreen: "🟢 Green Car",
        carBlack: "⬛ Black Car", score: "Score: ",
        highScore: "High Score: ", level: "Level: ",
        gameOver: "💥 Game Over!\nScore: "
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      langAr.classList.toggle("active", lang === "ar");
      langEn.classList.toggle("active", lang === "en");
      const t = i18n[lang];
      document.getElementById("titleTxt").innerText = t.title;
      document.getElementById("subTitleTxt").innerText = t.subtitle;
      easyBtn.innerText = t.easy; hardBtn.innerText = t.hard; startBtn.innerText = t.start;
      pauseBtn.innerText = t.resume; restartBtn.innerText = t.restart;
      document.getElementById("selectCarTxt").innerText = t.selectCar;
      car2Btn.innerText = t.carRed; car32Btn.innerText = t.carBlue;
      carExtraBtn.innerText = t.carGreen; car50Btn.innerText = t.carBlack;
    }

    langAr.onclick = () => setLanguage("ar");
    langEn.onclick = () => setLanguage("en");

    let difficulty = "easy"; 
    let paused = false, gameOver = false, currentCar = "car2", roadY = 0;
    let particles = [], coins = [], activeTraffic = [];

    // أبعاد موحدة لجميع السيارات
    const carWidth = 65;
    const carHeight = 130;

    easyBtn.onclick = () => { difficulty = "easy"; easyBtn.style.border = "2px solid gold"; hardBtn.style.border = "none"; };
    hardBtn.onclick = () => { difficulty = "hard"; hardBtn.style.border = "2px solid gold"; easyBtn.style.border = "none"; };

    car2Btn.onclick = () => { currentCar = "car2"; togglePause(); };
    car32Btn.onclick = () => { currentCar = "car32"; togglePause(); };
    carExtraBtn.onclick = () => { currentCar = "carExtra"; togglePause(); };
    car50Btn.onclick = () => { currentCar = "car50"; togglePause(); };

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resizeCanvas;
    resizeCanvas();

    const carImg = new Image(); carImg.src = "car2.png";
    const roadImg = new Image(); roadImg.src = "road.png";
    const car32Img = new Image(); car32Img.src = "car32.png";
    const carExtraImg = new Image(); carExtraImg.src = "carExtra.png";
    const car50Img = new Image(); car50Img.src = "car50.png";

    const allCars = [
      { id: "car2", img: carImg, color: "#e74c3c" },
      { id: "car32", img: car32Img, color: "#3498db" },
      { id: "carExtra", img: carExtraImg, color: "#2ecc71" },
      { id: "car50", img: car50Img, color: "#2c3e50" }
    ];

    const bgMusic = new Audio("background.mp3"); bgMusic.loop = true;
    const crashSound = new Audio("explosion.mp3");

    let carX, carY, score, level;

    function drawFallbackCar(x, y, width, height, bodyColor, isFlipped = false) {
      ctx.save();
      ctx.translate(x + width / 2, y + height / 2);
      if (isFlipped) ctx.rotate(Math.PI);

      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.roundRect(-width / 2, -height / 2, width, height, 12);
      ctx.fill();

      ctx.fillStyle = "#87CEEB";
      ctx.fillRect(-width / 2 + 6, -height / 4, width - 12, height / 5);
      ctx.fillRect(-width / 2 + 8, height / 4, width - 16, height / 8);

      ctx.fillStyle = "#111";
      ctx.fillRect(-width / 2 - 4, -height / 3, 6, 22);
      ctx.fillRect(width / 2 - 2, -height / 3, 6, 22);
      ctx.fillRect(-width / 2 - 4, height / 4, 6, 22);
      ctx.fillRect(width / 2 - 2, height / 4, 6, 22);

      ctx.restore();
    }

    function renderCar(img, x, y, width, height, color, isFlipped = false) {
      if (img.complete && img.naturalWidth !== 0) {
        ctx.save();
        ctx.translate(x + width / 2, y + height / 2);
        if (isFlipped) ctx.rotate(Math.PI);
        ctx.drawImage(img, -width / 2, -height / 2, width, height);
        ctx.restore();
      } else {
        drawFallbackCar(x, y, width, height, color, isFlipped);
      }
    }

    function setupTraffic() {
      activeTraffic = [];
      const opponents = allCars.filter(c => c.id !== currentCar);
      const count = (difficulty === "easy") ? 2 : 3;

      for (let i = 0; i < count; i++) {
        activeTraffic.push({
          id: opponents[i].id,
          img: opponents[i].img,
          color: opponents[i].color,
          x: Math.random() * (canvas.width - carWidth),
          y: -250 - (i * 300),
          speedFactor: 1 + (i * 0.25)
        });
      }
    }

    function spawnCoin() {
      if (Math.random() < 0.015 && coins.length < 2) {
        coins.push({ x: Math.random() * (canvas.width - 40) + 10, y: -40, size: 24 });
      }
    }

    function addExhaustSmoke(x, y) {
      if (Math.random() < 0.4) {
        particles.push({
          x: x + carWidth / 2 + (Math.random() * 10 - 5),
          y: y + carHeight - 5,
          vx: Math.random() * 2 - 1,
          vy: Math.random() * 2 + 2,
          radius: Math.random() * 4 + 2,
          alpha: 0.6, color: "#888"
        });
      }
    }

    function createExplosion(x, y) {
      for (let i = 0; i < 40; i++) {
        particles.push({
          x: x + carWidth / 2, y: y + carHeight / 2,
          vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
          radius: Math.random() * 6 + 3, alpha: 1,
          color: ["#ff0000", "#ff7700", "#ffff00"][Math.floor(Math.random() * 3)]
        });
      }
    }

    function resetGame() {
      resizeCanvas();
      carX = canvas.width / 2 - carWidth / 2;
      carY = canvas.height - carHeight - 40; 
      roadY = 0;
      score = 0; level = 1; particles = []; coins = [];
      gameOver = false; paused = false;
      controlPanel.style.display = "none";
      setupTraffic();
    }

    function checkCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
      return (
        x1 + w1 * 0.1 < x2 + w2 * 0.9 &&
        x1 + w1 * 0.9 > x2 + w2 * 0.1 &&
        y1 + h1 * 0.1 < y2 + h2 * 0.9 &&
        y1 + h1 * 0.9 > y2 + h2 * 0.1
      );
    }

    function drawGame() {
      if (gameOver || paused) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let scrollSpeed = (difficulty === "easy" ? 5 : 7) + level;
      roadY = (roadY + scrollSpeed) % canvas.height;

      if (roadImg.complete && roadImg.naturalWidth !== 0) {
        ctx.drawImage(roadImg, 0, roadY, canvas.width, canvas.height);
        ctx.drawImage(roadImg, 0, roadY - canvas.height, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#333"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#FFF";
        for (let i = -canvas.height; i < canvas.height; i += 80) {
          ctx.fillRect(canvas.width / 2 - 4, i + (roadY % 80), 8, 40);
        }
      }

      addExhaustSmoke(carX, carY);

      // رسم وتحديث الجسيمات
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
        ctx.globalAlpha = 1.0;
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      // رسم وتحديث العملات الذهبية
      spawnCoin();
      for (let i = coins.length - 1; i >= 0; i--) {
        let c = coins[i];
        c.y += scrollSpeed;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size / 2, 0, Math.PI * 2);
        ctx.fillStyle = "gold"; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();

        if (checkCollision(carX, carY, carWidth, carHeight, c.x - c.size/2, c.y - c.size/2, c.size, c.size)) {
          score += 10;
          coins.splice(i, 1);
        } else if (c.y > canvas.height) {
          coins.splice(i, 1);
        }
      }

      // رسم سيارة اللاعب بحجم موحد
      const playerCarObj = allCars.find(c => c.id === currentCar);
      renderCar(playerCarObj.img, carX, carY, carWidth, carHeight, playerCarObj.color, false);

      // رسم وتحديث حركة سيارات المرور (الخصوم)
      for (let i = 0; i < activeTraffic.length; i++) {
        let tCar = activeTraffic[i];
        let baseSpeed = (difficulty === "easy" ? 2.5 : 4) * tCar.speedFactor + level;

        if (difficulty === "hard") {
          if (tCar.x < carX) tCar.x += 0.8;
          else if (tCar.x > carX) tCar.x -= 0.8;
        }

        tCar.y += baseSpeed;
        renderCar(tCar.img, tCar.x, tCar.y, carWidth, carHeight, tCar.color, true);

        // فحص التصادم
        if (checkCollision(carX, carY, carWidth, carHeight, tCar.x, tCar.y, carWidth, carHeight)) {
          endGame();
        }

        // إعادة تدوير السيارات عند تجاوز الشاشة
        if (tCar.y > canvas.height) {
          tCar.y = -carHeight - Math.random() * 200 - 50;
          tCar.x = Math.random() * (canvas.width - carWidth);
          score++;
        }
      }

      if (score > 0 && score % 15 === 0) level = Math.floor(score / 15) + 1;

      // طباعة العدادات والنقاط
      const t = i18n[currentLang];
      ctx.fillStyle = "white"; ctx.font = "bold 18px Arial";
      if (currentLang === "ar") {
        ctx.textAlign = "right";
        ctx.fillText(`${t.score} ${score}`, canvas.width - 20, 35);
        ctx.fillText(`${t.highScore} ${highScore}`, canvas.width - 20, 65);
        ctx.fillText(`${t.level} ${level}`, canvas.width - 20, 95);
      } else {
        ctx.textAlign = "left";
        ctx.fillText(`${t.score} ${score}`, 20, 35);
        ctx.fillText(`${t.highScore} ${highScore}`, 20, 65);
        ctx.fillText(`${t.level} ${level}`, 20, 95);
      }

      requestAnimationFrame(drawGame);
    }

    function endGame() {
      gameOver = true;
      createExplosion(carX, carY);
      bgMusic.pause();
      try { crashSound.play(); } catch(e){}

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("carRace_highScore", highScore);
      }

      setTimeout(() => {
        const t = i18n[currentLang];
        alert(t.gameOver + score + "\n" + t.highScore + highScore);
        controlPanel.style.display = "block";
        pauseBtn.style.display = "none";
        restartBtn.style.display = "block";
      }, 100);
    }

    document.onkeydown = (e) => {
      if (gameOver || paused) return;
      let step = 25;
      if (e.key === "ArrowLeft" && carX > 0) carX -= step;
      if (e.key === "ArrowRight" && carX < canvas.width - carWidth) carX += step;
      if (e.key === "ArrowUp" && carY > 0) carY -= step;
      if (e.key === "ArrowDown" && carY < canvas.height - carHeight) carY += step;
    };

    function handleTouch(e) {
      if (gameOver || paused) return;
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      carX = (touch.clientX - rect.left) - carWidth / 2;
      carY = (touch.clientY - rect.top) - carHeight / 2;
      if (carX < 0) carX = 0; if (carX > canvas.width - carWidth) carX = canvas.width - carWidth;
      if (carY < 0) carY = 0; if (carY > canvas.height - carHeight) carY = canvas.height - carHeight;
    }

    canvas.addEventListener("touchmove", (e) => { handleTouch(e); e.preventDefault(); }, { passive: false });
    canvas.addEventListener("touchstart", (e) => { handleTouch(e); }, { passive: true });

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      if (paused) {
        bgMusic.pause();
        controlPanel.style.display = "block";
        pauseBtn.style.display = "block";
        restartBtn.style.display = "block";
      } else {
        try { bgMusic.play(); } catch(e){}
        controlPanel.style.display = "none";
        drawGame();
      }
    }

    pauseBtn.onclick = togglePause;

    restartBtn.onclick = () => { resetGame(); try { bgMusic.play(); } catch(e){} drawGame(); };
    startBtn.onclick = () => { startScreen.style.display = "none"; canvas.style.display = "block"; resetGame(); try { bgMusic.play(); } catch(e){} drawGame(); };

    window.addEventListener("deviceorientation", (e) => {
      if (gameOver || paused || !e.gamma) return;
      if (e.gamma < -5 && carX > 0) carX -= 6;
      if (e.gamma > 5 && carX < canvas.width - carWidth) carX += 6;
    });
  </script>
</body>
</html>
