<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏎️ Smart AI Car Race</title>
  <style>
    body { background-color: #111; margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: none; background-color: #222; margin: 0 auto; display: block; }
    
    #startScreen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; width: 90%; z-index: 30; background: rgba(0,0,0,0.85); padding: 25px; border-radius: 15px; border: 1px solid #444; }
    .lang-container { margin-bottom: 15px; display: flex; justify-content: center; gap: 10px; }
    .lang-btn { padding: 8px 16px; font-size: 14px; background: #333; color: white; border: 1px solid white; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background: #e74c3c; border-color: gold; font-weight: bold; }

    button { margin: 6px; padding: 12px 20px; font-size: 16px; background: linear-gradient(45deg, #e74c3c, #c0392b); color: white; border: none; cursor: pointer; border-radius: 8px; transition: 0.2s; }
    button:active { transform: scale(0.95); }
    
    #controlPanel { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.95); padding: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(231,76,60,0.5); z-index: 20; min-width: 250px; }
    #controlPanel button { display: block; margin: 8px auto; width: 100%; }
  </style>
</head>
<body>

  <div id="startScreen">
    <div class="lang-container">
      <button id="langAr" class="lang-btn active">🇸🇦 العربية</button>
      <button id="langEn" class="lang-btn">🇬🇧 English</button>
    </div>

    <h1 id="titleTxt">🏎️ سباق الذكاء الاصطناعي الذكي</h1>
    <p id="subTitleTxt">تم تطوير الذكاء الاصطناعي للسيارات وإصلاح التصادم والاتجاهات</p>
    <button id="easyBtn" style="border: 2px solid gold;">😎 سهل (الذكاء عادي)</button>
    <button id="hardBtn">🔥 صعب (ذكاء عدواني)</button>
    <br><br>
    <button id="startBtn">▶ بدء اللعب</button>
  </div>

  <canvas id="gameCanvas"></canvas>
  
  <div id="controlPanel">
    <button id="pauseBtn">⏸ استئناف</button>
    <button id="restartBtn">🔄 إعادة التشغيل</button>
    <hr style="border-color: #444; margin: 10px 0;">
    <p id="selectCarTxt" style="color: white; margin: 5px 0;">اختر سيارتك:</p>
    <button id="car2Btn">🔴 الحمراء</button>
    <button id="car32Btn">🔵 الزرقاء</button>
    <button id="carExtraBtn">🟢 الخضراء</button>
    <button id="car50Btn">⬛ السوداء</button>
  </div>
  
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");
    const controlPanel = document.getElementById("controlPanel");
    const restartBtn = document.getElementById("restartBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    
    const easyBtn = document.getElementById("easyBtn");
    const hardBtn = document.getElementById("hardBtn");

    const car2Btn = document.getElementById("car2Btn");
    const car32Btn = document.getElementById("car32Btn");
    const carExtraBtn = document.getElementById("carExtraBtn");
    const car50Btn = document.getElementById("car50Btn");

    const langAr = document.getElementById("langAr");
    const langEn = document.getElementById("langEn");

    let currentLang = "ar";
    let highScore = localStorage.getItem("carRace_highScore") || 0;

    const i18n = {
      ar: {
        title: "🏎️ سباق الذكاء الاصطناعي الذكي",
        subtitle: "تم تطوير نظام AI وتصحيح زوايا السيارات والتصادم",
        easy: "😎 سهل", hard: "🔥 صعب (AI متطور)", start: "▶ بدء اللعب",
        resume: "⏸ استئناف", restart: "🔄 إعادة التشغيل",
        selectCar: "اختر سيارتك:", carRed: "🔴 الحمراء", carBlue: "🔵 الزرقاء", carGreen: "🟢 الخضراء", carBlack: "⬛ السوداء",
        score: "النقاط: ", highScore: "أعلى نتيجة: ", level: "المستوى: ", gameOver: "💥 انتهت اللعبة!\nالنقاط: "
      },
      en: {
        title: "🏎️ Smart AI Car Race",
        subtitle: "Improved AI system, hitboxes & car orientations",
        easy: "😎 Easy", hard: "🔥 Hard (Advanced AI)", start: "▶ Start Game",
        resume: "⏸ Resume", restart: "🔄 Restart",
        selectCar: "Choose Your Car:", carRed: "🔴 Red", carBlue: "🔵 Blue", carGreen: "🟢 Green", carBlack: "⬛ Black",
        score: "Score: ", highScore: "High Score: ", level: "Level: ", gameOver: "💥 Game Over!\nScore: "
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      langAr.classList.toggle("active", lang === "ar");
      langEn.classList.toggle("active", lang === "en");
      const t = i18n[lang];
      document.getElementById("titleTxt").innerText = t.title;
      document.getElementById("subTitleTxt").innerText = t.subtitle;
      easyBtn.innerText = t.easy; hardBtn.innerText = t.hard; startBtn.innerText = t.start;
      pauseBtn.innerText = t.resume; restartBtn.innerText = t.restart;
      document.getElementById("selectCarTxt").innerText = t.selectCar;
      car2Btn.innerText = t.carRed; car32Btn.innerText = t.carBlue; carExtraBtn.innerText = t.carGreen; car50Btn.innerText = t.carBlack;
    }

    langAr.onclick = () => setLanguage("ar");
    langEn.onclick = () => setLanguage("en");

    let difficulty = "easy"; 
    let paused = false, gameOver = false, currentCar = "car2", roadY = 0;
    let particles = [], coins = [], aiVehicles = [];

    const carWidth = 60;
    const carHeight = 120;
    let lanes = [];

    easyBtn.onclick = () => { difficulty = "easy"; easyBtn.style.border = "2px solid gold"; hardBtn.style.border = "none"; };
    hardBtn.onclick = () => { difficulty = "hard"; hardBtn.style.border = "2px solid gold"; easyBtn.style.border = "none"; };

    car2Btn.onclick = () => { currentCar = "car2"; togglePause(); };
    car32Btn.onclick = () => { currentCar = "car32"; togglePause(); };
    carExtraBtn.onclick = () => { currentCar = "carExtra"; togglePause(); };
    car50Btn.onclick = () => { currentCar = "car50"; togglePause(); };

    function resizeCanvas() { 
      canvas.width = Math.min(window.innerWidth, 500); 
      canvas.height = window.innerHeight;
      lanes = [
        canvas.width * 0.2,
        canvas.width * 0.5,
        canvas.width * 0.8
      ];
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    const carImg = new Image(); carImg.src = "car2.png";
    const roadImg = new Image(); roadImg.src = "road.png";
    const car32Img = new Image(); car32Img.src = "car32.png";
    const carExtraImg = new Image(); carExtraImg.src = "carExtra.png";
    const car50Img = new Image(); car50Img.src = "car50.png";

    const allCars = [
      { id: "car2", img: carImg, color: "#e74c3c" },
      { id: "car32", img: car32Img, color: "#3498db" },
      { id: "carExtra", img: carExtraImg, color: "#2ecc71" },
      { id: "car50", img: car50Img, color: "#34495e" }
    ];

    const bgMusic = new Audio("background.mp3"); bgMusic.loop = true;
    const crashSound = new Audio("explosion.mp3");

    let playerX, playerY, playerVx = 0, score, level, dodgedCars;

    // رسم السيارة في حال عدم تحميل الصورة (بديل دقيق)
    function drawProceduralCar(w, h, color, isPlayer) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(-w / 2, -h / 2, w, h, 10);
      ctx.fill();

      ctx.fillStyle = "#87CEEB";
      const windshieldY = isPlayer ? -h / 4 : h / 10;
      ctx.fillRect(-w / 2 + 5, windshieldY, w - 10, h / 5);

      ctx.fillStyle = "#111";
      ctx.fillRect(-w / 2 - 3, -h / 3, 5, 20);
      ctx.fillRect(w / 2 - 2, -h / 3, 5, 20);
      ctx.fillRect(-w / 2 - 3, h / 4, 5, 20);
      ctx.fillRect(w / 2 - 2, h / 4, 5, 20);
    }

    // دالة رسم موحدة تضمن الاتجاه الصحيح تماماً ومنع الانعكاس المقلوب
    function renderVehicle(img, x, y, w, h, color, isPlayer, vx = 0) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);

      // الاتجاه: اللاعب للأعلى (0) والمرور للأسفل (180 درجة) + تمايل طفيف مع الانعطاف
      let angle = isPlayer ? 0 : Math.PI;
      angle += (vx * 0.03); 

      ctx.rotate(angle);

      if (img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
      } else {
        drawProceduralCar(w, h, color, isPlayer);
      }

      ctx.restore();
    }

    // كلاس الذكاء الاصطناعي الذكي لسيارات المرور
    class AICarController {
      constructor(model, laneIndex) {
        this.model = model;
        this.w = carWidth;
        this.h = carHeight;
        this.reset(laneIndex);
      }

      reset(laneIndex = Math.floor(Math.random() * lanes.length)) {
        this.lane = laneIndex;
        this.x = lanes[this.lane] - this.w / 2;
        this.y = -this.h - Math.random() * 300;
        this.speed = 3 + Math.random() * 2;
        this.targetX = this.x;
        this.vx = 0;
      }

      update(player, traffic) {
        let speedMultiplier = 1 + (level * 0.1);
        let currentSpeed = this.speed * speedMultiplier;

        // 1. نظام الرادار: اكتشاف السيارات أمامها للحد من التصادامات بين AI ببعضه
        let carAhead = null;
        let minDistance = 180;

        for (let other of traffic) {
          if (other === this) continue;
          if (Math.abs(other.x - this.x) < this.w * 0.8) {
            let dist = other.y - this.y;
            if (dist > 0 && dist < minDistance) {
              minDistance = dist;
              carAhead = other;
            }
          }
        }

        // 2. اتخاذ القرار التكتيكي (Decision Making)
        if (carAhead) {
          // تخفيف السرعة محلياً
          currentSpeed = Math.max(1, carAhead.speed - 0.5);
          
          // محاولة تغيير المسار
          let availableLanes = lanes.filter((l, idx) => idx !== this.lane);
          let preferredLane = availableLanes[Math.floor(Math.random() * availableLanes.length)];
          this.targetX = preferredLane - this.w / 2;
        } else {
          // في المستوى الصعب: محاولة إعاقة اللاعب بذكاء وبدون حركة فجائية
          if (difficulty === "hard" && this.y < player.y && (player.y - this.y) < 350) {
            this.targetX = player.x;
          }
        }

        // 3. التوجيه السلس (Smooth Steering Physics)
        let dx = this.targetX - this.x;
        this.vx = dx * 0.08; 
        this.x += this.vx;

        // 4. الحركة للأمام
        this.y += currentSpeed;

        // إعادة التدوير عند الخروج من الشاشة
        if (this.y > canvas.height + 100) {
          this.reset();
          score += 1;
          dodgedCars += 1;
          level = Math.floor(dodgedCars / 8) + 1;
        }
      }
    }

    function setupAI() {
      aiVehicles = [];
      const opponents = allCars.filter(c => c.id !== currentCar);
      const count = difficulty === "easy" ? 2 : 3;

      for (let i = 0; i < count; i++) {
        let laneIndex = i % lanes.length;
        aiVehicles.push(new AICarController(opponents[i % opponents.length], laneIndex));
      }
    }

    function spawnCoin() {
      if (Math.random() < 0.015 && coins.length < 2) {
        coins.push({ x: Math.random() * (canvas.width - 40) + 20, y: -40, size: 22 });
      }
    }

    function resetGame() {
      resizeCanvas();
      playerX = canvas.width / 2 - carWidth / 2;
      playerY = canvas.height - carHeight - 40; 
      playerVx = 0;
      roadY = 0;
      score = 0; 
      dodgedCars = 0; 
      level = 1; 
      particles = []; 
      coins = [];
      gameOver = false; 
      paused = false;
      controlPanel.style.display = "none";
      setupAI();
    }

    // خوارزمية التصادم الدقيقة (Proportional Bounding Box)
    function checkAccurateCollision(aX, aY, aW, aH, bX, bY, bW, bH) {
      // اقتطاع 15% من الحواف الجانبية و10% من الحواف الطولية لمنع التصادم الوهمي
      const marginX = aW * 0.15;
      const marginY = aH * 0.10;

      return (
        aX + marginX < bX + bW - marginX &&
        aX + aW - marginX > bX + marginX &&
        aY + marginY < bY + bH - marginY &&
        aY + aH - marginY > bY + marginY
      );
    }

    function drawGame() {
      if (gameOver || paused) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let roadSpeed = (difficulty === "easy" ? 5 : 7) + level;
      roadY = (roadY + roadSpeed) % canvas.height;

      // رسم الطريق
      if (roadImg.complete && roadImg.naturalWidth !== 0) {
        ctx.drawImage(roadImg, 0, roadY, canvas.width, canvas.height);
        ctx.drawImage(roadImg, 0, roadY - canvas.height, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#333"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#FFF";
        for (let i = -canvas.height; i < canvas.height; i += 80) {
          ctx.fillRect(canvas.width / 2 - 3, i + (roadY % 80), 6, 35);
        }
      }

      // رسم وتحديث النقود (تزود النقاط فقط دون تأثير على السرعة)
      spawnCoin();
      for (let i = coins.length - 1; i >= 0; i--) {
        let c = coins[i];
        c.y += roadSpeed;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size / 2, 0, Math.PI * 2);
        ctx.fillStyle = "gold"; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();

        // التقاط النقود
        if (Math.hypot((playerX + carWidth / 2) - c.x, (playerY + carHeight / 2) - c.y) < carWidth / 2 + c.size / 2) {
          score += 10;
          coins.splice(i, 1);
        } else if (c.y > canvas.height) {
          coins.splice(i, 1);
        }
      }

      // رسم سيارة اللاعب بترخيص اتجاه صحيح 100%
      const playerModel = allCars.find(c => c.id === currentCar);
      renderVehicle(playerModel.img, playerX, playerY, carWidth, carHeight, playerModel.color, true, playerVx);

      // تحديث ورسم سيارات الذكاء الاصطناعي
      for (let ai of aiVehicles) {
        ai.update({ x: playerX, y: playerY }, aiVehicles);
        renderVehicle(ai.model.img, ai.x, ai.y, ai.w, ai.h, ai.model.color, false, ai.vx);

        // فحص التصادم الدقيق مع سيارة اللاعب
        if (checkAccurateCollision(playerX, playerY, carWidth, carHeight, ai.x, ai.y, ai.w, ai.h)) {
          endGame();
        }
      }

      // طباعة العدادات
      const t = i18n[currentLang];
      ctx.fillStyle = "white"; ctx.font = "bold 16px Arial";
      if (currentLang === "ar") {
        ctx.textAlign = "right";
        ctx.fillText(`${t.score} ${score}`, canvas.width - 20, 30);
        ctx.fillText(`${t.highScore} ${highScore}`, canvas.width - 20, 55);
        ctx.fillText(`${t.level} ${level}`, canvas.width - 20, 80);
      } else {
        ctx.textAlign = "left";
        ctx.fillText(`${t.score} ${score}`, 20, 30);
        ctx.fillText(`${t.highScore} ${highScore}`, 20, 55);
        ctx.fillText(`${t.level} ${level}`, 20, 80);
      }

      requestAnimationFrame(drawGame);
    }

    function endGame() {
      gameOver = true;
      bgMusic.pause();
      try { crashSound.play(); } catch(e){}

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("carRace_highScore", highScore);
      }

      setTimeout(() => {
        const t = i18n[currentLang];
        alert(t.gameOver + score + "\n" + t.highScore + highScore);
        controlPanel.style.display = "block";
        pauseBtn.style.display = "none";
        restartBtn.style.display = "block";
      }, 100);
    }

    document.onkeydown = (e) => {
      if (gameOver || paused) return;
      let step = 20;
      if (e.key === "ArrowLeft" && playerX > 0) { playerX -= step; playerVx = -5; }
      if (e.key === "ArrowRight" && playerX < canvas.width - carWidth) { playerX += step; playerVx = 5; }
      if (e.key === "ArrowUp" && playerY > 0) playerY -= step;
      if (e.key === "ArrowDown" && playerY < canvas.height - carHeight) playerY += step;
    };
    document.onkeyup = () => { playerVx = 0; };

    function handleTouch(e) {
      if (gameOver || paused) return;
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      let targetX = (touch.clientX - rect.left) - carWidth / 2;
      playerVx = targetX - playerX;
      playerX = Math.max(0, Math.min(canvas.width - carWidth, targetX));
      playerY = Math.max(0, Math.min(canvas.height - carHeight, (touch.clientY - rect.top) - carHeight / 2));
    }

    canvas.addEventListener("touchmove", (e) => { handleTouch(e); e.preventDefault(); }, { passive: false });
    canvas.addEventListener("touchstart", (e) => handleTouch(e), { passive: true });
    canvas.addEventListener("touchend", () => { playerVx = 0; });

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      if (paused) {
        bgMusic.pause();
        controlPanel.style.display = "block";
        pauseBtn.style.display = "block";
        restartBtn.style.display = "block";
      } else {
        try { bgMusic.play(); } catch(e){}
        controlPanel.style.display = "none";
        drawGame();
      }
    }

    pauseBtn.onclick = togglePause;
    restartBtn.onclick = () => { resetGame(); try { bgMusic.play(); } catch(e){} drawGame(); };
    startBtn.onclick = () => { startScreen.style.display = "none"; canvas.style.display = "block"; resetGame(); try { bgMusic.play(); } catch(e){} drawGame(); };
  </script>
</body>
</html>
