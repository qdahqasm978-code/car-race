<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>🎮 مركز الألعاب: التصادم والحظ</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0d0d0d;
    font-family:Arial,"Segoe UI",sans-serif;
    user-select:none;
    -webkit-user-select:none;
}

canvas{
    display:none;
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    touch-action:none;
}

.overlay-card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:92%;
    max-width:430px;
    max-height:94vh;

    overflow-y:auto;

    padding:18px;

    text-align:center;

    color:white;

    background:rgba(15,15,15,.97);

    border:2px solid #e74c3c;
    border-radius:15px;

    box-shadow:
        0 0 25px rgba(231,76,60,.4);

    z-index:20;
}

.lang-container{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:10px;
}

.lang-btn{
    padding:7px 14px;
    background:#222;
    color:white;
    border:1px solid #555;
    border-radius:7px;
    cursor:pointer;
    font-size:13px;
}

.lang-btn.active{
    background:#e74c3c;
    border-color:gold;
    font-weight:bold;
}

.money-badge{
    display:inline-block;

    margin:7px 0;

    padding:7px 15px;

    background:#27ae60;

    border:1px solid #2ecc71;

    border-radius:20px;

    font-weight:bold;
}

.menu-btn{
    margin:5px;

    padding:10px 18px;

    border:none;

    border-radius:8px;

    background:
        linear-gradient(
            45deg,
            #e74c3c,
            #c0392b
        );

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}

.menu-btn:active,
.car-btn:active,
.lang-btn:active,
.casino-btn:active{
    transform:scale(.96);
}

.car-shop{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

    margin:8px 0;
}

.car-btn{
    min-height:60px;

    padding:8px;

    border:1px solid #444;

    border-radius:8px;

    color:white;

    cursor:pointer;

    font-size:12px;

    font-weight:bold;

    white-space:pre-line;
}

.road-shop-box{
    margin:10px 0;

    padding:10px;

    background:#1a1a1a;

    border:1px dashed #f39c12;

    border-radius:10px;

    touch-action:pan-y;
}

.swipe-hint{
    margin-top:3px;

    color:#888;

    font-size:11px;
}

#startBtn{
    width:80%;
    margin-top:8px;
    font-size:17px;
}

#controlPanel{
    display:none;

===================================================== */

}

.reels-container {
    display: flex;

   نظام الأمان والتطهير والحماية (Game Security Module)
===================================================== */

const GameSecurity = {
    // دالة تشفير للتحقق من كود الشحن بدون كتابة كلمة السر كـ Plain Text
    checkCheatCode: function(inputStr) {
        if (!inputStr) return false;
        let hash = 0;
        for (let i = 0; i < inputStr.length; i++) {
            hash = ((hash << 5) - hash) + inputStr.charCodeAt(i);
            hash |= 0;
        }
        // Hash لكلمة السر jfjf747g هو -1087113193
        return hash === -1087113193;
    },

    // تطهير المدخلات النصية لحماية الواجهة من XSS
    sanitizeText: function(text) {
        if (typeof text !== "string") return "";
        return text.replace(/[&<>"']/g, function(m) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m];
        }).trim();
    },

    // حماية الرصيد ومنع القيم السالبة أو غير الرقمية
    validateAmount: function(val) {
        const num = Math.floor(Number(val));
        if (isNaN(num) || !isFinite(num) || num < 0) return 0;
        return num;
    },

    // التحقق من صحة وقانونية الرهان
    validateBet: function(bet, currentBalance) {
        const validBet = this.validateAmount(bet);
        const validBalance = this.validateAmount(currentBalance);
        if (validBet <= 0 || validBet > validBalance) return false;
        return validBet;
    }
};
