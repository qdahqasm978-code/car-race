<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏎️ Precision Hitbox & AI Car Race</title>
  <style>
    body { background-color: #0d0d0d; margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
    canvas { display: none; background-color: #222; margin: 0 auto; display: block; }
    
    .overlay-card { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; width: 90%; max-width: 420px; z-index: 30; background: rgba(15,15,15,0.95); padding: 20px; border-radius: 15px; border: 2px solid #e74c3c; box-shadow: 0 0 25px rgba(231,76,60,0.4); }
    .lang-container { margin-bottom: 12px; display: flex; justify-content: center; gap: 10px; }
    .lang-btn { padding: 6px 14px; font-size: 13px; background: #222; color: white; border: 1px solid #555; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background: #e74c3c; border-color: gold; font-weight: bold; }

    button.menu-btn { margin: 6px; padding: 10px 18px; font-size: 15px; background: linear-gradient(45deg, #e74c3c, #c0392b); color: white; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.2s; }
    button.menu-btn:active { transform: scale(0.95); }

    .car-shop { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .car-btn { padding: 10px; font-size: 13px; color: white; border: 1px solid #444; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .car-btn:active { transform: scale(0.95); }
    
    .money-badge { background: #27ae60; color: #fff; padding: 6px 14px; border-radius: 20px; font-weight: bold; display: inline-block; margin: 8px 0; font-size: 16px; border: 1px solid #2ecc71; }
  </style>
</head>
<body>

  <div id="startScreen" class="overlay-card">
    <div class="lang-container">
      <button id="langAr" class="lang-btn active">🇸🇦 العربية</button>
      <button id="langEn" class="lang-btn">🇬🇧 English</button>
    </div>

    <h2 id="titleTxt">🏎️ سباق وتصادم دقيق 100%</h2>
    <div class="money-badge" id="startMoneyTxt">💰 النقود: $0</div>
    
    <p id="selectCarTxt" style="margin: 5px 0; font-size: 14px; color: #aaa;">اختر أو اشترِ سيارتك:</p>
    <div class="car-shop">
      <button id="car2Btn" class="car-btn"></button>
      <button id="car32Btn" class="car-btn"></button>
      <button id="carExtraBtn" class="car-btn"></button>
      <button id="car50Btn" class="car-btn"></button>
    </div>

    <button id="easyBtn" class="menu-btn" style="border: 2px solid gold;">😎 هجوم عادي</button>
    <button id="hardBtn" class="menu-btn">🔥 هجوم شرس</button>
    <br>
    <button id="startBtn" class="menu-btn" style="width: 80%; margin-top: 10px; font-size: 18px;">▶ بدء اللعب</button>
  </div>

  <canvas id="gameCanvas"></canvas>
  
  <div id="controlPanel" class="overlay-card" style="display: none;">
    <button id="pauseBtn" class="menu-btn" style="width: 100%;">⏸ استئناف</button>
    <button id="restartBtn" class="menu-btn" style="width: 100%;">🔄 إعادة التشغيل</button>
  </div>
  
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");
    const controlPanel = document.getElementById("controlPanel");
    const restartBtn = document.getElementById("restartBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const startMoneyTxt = document.getElementById("startMoneyTxt");
    
    const easyBtn = document.getElementById("easyBtn");
    const hardBtn = document.getElementById("hardBtn");
    const langAr = document.getElementById("langAr");
    const langEn = document.getElementById("langEn");

    let currentLang = "ar";
    let highScore = parseInt(localStorage.getItem("carRace_highScore")) || 0;
    let money = parseInt(localStorage.getItem("carRace_money")) || 0;
    let unlockedCars = JSON.parse(localStorage.getItem("carRace_unlockedCars")) || ["car2"];
    let currentCar = localStorage.getItem("carRace_currentCar") || "car2";

    const carImg = new Image(); carImg.src = "car2.png";
    const roadImg = new Image(); roadImg.src = "road.png";
    const car32Img = new Image(); car32Img.src = "car32.png";
    const carExtraImg = new Image(); carExtraImg.src = "carExtra.png";
    const car50Img = new Image(); car50Img.src = "car50.png";

    const allCars = [
      { id: "car2", img: carImg, color: "#e74c3c", price: 0, nameAr: "🔴 الحمراء", nameEn: "🔴 Red" },
      { id: "car32", img: car32Img, color: "#3498db", price: 100, nameAr: "🔵 الزرقاء", nameEn: "🔵 Blue" },
      { id: "carExtra", img: carExtraImg, color: "#2ecc71", price: 250, nameAr: "🟢 الخضراء", nameEn: "🟢 Green" },
      { id: "car50", img: car50Img, color: "#34495e", price: 500, nameAr: "⬛ السوداء", nameEn: "⬛ Black" }
    ];

    const i18n = {
      ar: {
        title: "🏎️ سباق وتصادم دقيق 100%",
        easy: "😎 هجوم عادي", hard: "🔥 هجوم شرس", start: "▶ بدء اللعب",
        resume: "⏸ استئناف", restart: "🔄 إعادة التشغيل",
        selectCar: "اختر أو اشترِ سيارتك:", money: "💰 النقود: $",
        score: "النقاط: ", highScore: "أعلى نتيجة: ", level: "المستوى: ",
        gameOver: "💥 تصادم ملموس!\nالنقاط: ", driving: "مختارة", drive: "قيادة", buy: "شراء"
      },
      en: {
        title: "🏎️ Precision Hitbox Race",
        easy: "😎 Normal Attack", hard: "🔥 Aggressive", start: "▶ Start Game",
        resume: "⏸ Resume", restart: "🔄 Restart",
        selectCar: "Choose or Buy Your Car:", money: "💰 Cash: $",
        score: "Score: ", highScore: "High Score: ", level: "Level: ",
        gameOver: "💥 Direct Impact!\nScore: ", driving: "Active", drive: "Select", buy: "Buy"
      }
    };

    function updateCarButtons() {
      const t = i18n[currentLang];
      startMoneyTxt.innerText = `${t.money}${money}`;
      
      allCars.forEach(car => {
        const btn = document.getElementById(car.id + "Btn");
        if (!btn) return;

        const isUnlocked = unlockedCars.includes(car.id);
        const isSelected = currentCar === car.id;
        const carName = currentLang === "ar" ? car.nameAr : car.nameEn;

        if (isSelected) {
          btn.innerText = `${carName}\n(✔ ${t.driving})`;
          btn.style.background = "linear-gradient(45deg, #27ae60, #2ecc71)";
        } else if (isUnlocked) {
          btn.innerText = `${carName}\n(${t.drive})`;
          btn.style.background = "linear-gradient(45deg, #2980b9, #3498db)";
        } else {
          btn.innerText = `${carName}\n🔒 $${car.price}`;
          btn.style.background = "linear-gradient(45deg, #7f8c8d, #95a5a6)";
        }
      });
    }

    function handleCarClick(carId) {
      const car = allCars.find(c => c.id === carId);
      if (!car) return;

      if (unlockedCars.includes(carId)) {
        currentCar = carId;
        localStorage.setItem("carRace_currentCar", currentCar);
      } else {
        if (money >= car.price) {
          money -= car.price;
          unlockedCars.push(carId);
          currentCar = carId;
          localStorage.setItem("carRace_money", money);
          localStorage.setItem("carRace_unlockedCars", JSON.stringify(unlockedCars));
          localStorage.setItem("carRace_currentCar", currentCar);
        } else {
          alert(currentLang === "ar" ? `تحتاج إلى $${car.price - money} إضافية لشراء هذه السيارة!` : `You need $${car.price - money} more cash!`);
        }
      }
      updateCarButtons();
    }

    allCars.forEach(car => {
      document.getElementById(car.id + "Btn").onclick = () => handleCarClick(car.id);
    });

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      langAr.classList.toggle("active", lang === "ar");
      langEn.classList.toggle("active", lang === "en");
      const t = i18n[lang];
      document.getElementById("titleTxt").innerText = t.title;
      document.getElementById("selectCarTxt").innerText = t.selectCar;
      easyBtn.innerText = t.easy; hardBtn.innerText = t.hard; startBtn.innerText = t.start;
      pauseBtn.innerText = t.resume; restartBtn.innerText = t.restart;
      updateCarButtons();
    }

    langAr.onclick = () => setLanguage("ar");
    langEn.onclick = () => setLanguage("en");

    let difficulty = "easy"; 
    let paused = false, gameOver = false, roadY = 0;
    let coins = [], attackerCars = [], sparks = [];

    const carWidth = 52;
    const carHeight = 105;

    easyBtn.onclick = () => { difficulty = "easy"; easyBtn.style.border = "2px solid gold"; hardBtn.style.border = "none"; };
    hardBtn.onclick = () => { difficulty = "hard"; hardBtn.style.border = "2px solid gold"; easyBtn.style.border = "none"; };

    function resizeCanvas() { 
      canvas.width = Math.min(window.innerWidth, 480); 
      canvas.height = window.innerHeight;
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    const bgMusic = new Audio("background.mp3"); bgMusic.loop = true;
    const crashSound = new Audio("explosion.mp3");

    let playerX, playerY, playerVx = 0, score, level, dodgedCars;

    function drawFallbackCar(w, h, color, isPlayer) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(-w / 2, -h / 2, w, h, 8);
      ctx.fill();

      ctx.fillStyle = "#87CEEB";
      const glassY = isPlayer ? -h / 4 : h / 10;
      ctx.fillRect(-w / 2 + 4, glassY, w - 8, h / 4);

      ctx.fillStyle = "#111";
      ctx.fillRect(-w / 2 - 3, -h / 3, 4, 18);
      ctx.fillRect(w / 2 - 1, -h / 3, 4, 18);
      ctx.fillRect(-w / 2 - 3, h / 4, 4, 18);
      ctx.fillRect(w / 2 - 1, h / 4, 4, 18);
    }

    function renderCarVehicle(img, x, y, w, h, color, isPlayer, tilt = 0) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);

      let rotationAngle = isPlayer ? 0 : Math.PI;
      rotationAngle += (tilt * 0.04); 

      ctx.rotate(rotationAngle);

      if (img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
      } else {
        drawFallbackCar(w, h, color, isPlayer);
      }

      ctx.restore();
    }

    // ==========================================
    // نظام الدوائر الهيكلية لتصادم ملموس ومُحكَم 100%
    // ==========================================
    function getCarHitNodes(x, y, w, h) {
      const radius = w * 0.38; // نطاق نصف قطر دقيق يغطي عرض السيارة الفعلي
      return [
        { x: x + w / 2, y: y + h * 0.20, r: radius }, // عقدة المقدمة
        { x: x + w / 2, y: y + h * 0.50, r: radius }, // عقدة المنتصف
        { x: x + w / 2, y: y + h * 0.80, r: radius }  // عقدة الخلفية
      ];
    }

    function checkNodeCollision(carA, carB) {
      const nodesA = getCarHitNodes(carA.x, carA.y, carA.w, carA.h);
      const nodesB = getCarHitNodes(carB.x, carB.y, carB.w, carB.h);

      for (let nA of nodesA) {
        for (let nB of nodesB) {
          const dx = nA.x - nB.x;
          const dy = nA.y - nB.y;
          const distanceSq = dx * dx + dy * dy;
          const minDistance = nA.r + nB.r;

          if (distanceSq < minDistance * minDistance) {
            return true; // اصطدام ملموس ومباشر بين جسمي السيارتين
          }
        }
      }
      return false;
    }

    class AttackerVehicle {
      constructor(carModel) {
        this.model = carModel;
        this.w = carWidth;
        this.h = carHeight;
        this.reset();
      }

      reset() {
        this.x = Math.random() * (canvas.width - this.w);
        this.y = -this.h - Math.random() * 300;
        this.speed = (difficulty === "easy" ? 3.5 : 5) + Math.random() * 2;
        this.attackAgility = difficulty === "easy" ? 0.022 : 0.048;
        this.vx = 0;
      }

      update(targetPlayerX) {
        let diffX = targetPlayerX - this.x;
        this.vx = diffX * this.attackAgility;
        this.x += this.vx;
        this.y += this.speed + (level * 0.4);

        if (this.y > canvas.height + 50) {
          this.reset();
          score += 1;
          dodgedCars += 1;
          level = Math.floor(dodgedCars / 7) + 1;
        }
      }
    }

    function setupAttackers() {
      attackerCars = [];
      const opponents = allCars.filter(c => c.id !== currentCar);
      const count = difficulty === "easy" ? 2 : 3;

      for (let i = 0; i < count; i++) {
        attackerCars.push(new AttackerVehicle(opponents[i % opponents.length]));
      }
    }

    function spawnCoin() {
      if (Math.random() < 0.02 && coins.length < 3) {
        coins.push({ x: Math.random() * (canvas.width - 40) + 20, y: -40, value: 10, size: 24 });
      }
    }

    function createCrashSparks(x, y) {
      for (let i = 0; i < 30; i++) {
        sparks.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.5) * 14,
          size: Math.random() * 4 + 2,
          life: 1
        });
      }
    }

    function resetGame() {
      resizeCanvas();
      playerX = canvas.width / 2 - carWidth / 2;
      playerY = canvas.height - carHeight - 30; 
      playerVx = 0;
      roadY = 0;
      score = 0; 
      dodgedCars = 0; 
      level = 1; 
      coins = [];
      sparks = [];
      gameOver = false; 
      paused = false;
      controlPanel.style.display = "none";
      setupAttackers();
    }

    function drawGame() {
      if (gameOver || paused) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let roadSpeed = (difficulty === "easy" ? 6 : 8) + level;
      roadY = (roadY + roadSpeed) % canvas.height;

      if (roadImg.complete && roadImg.naturalWidth !== 0) {
        ctx.drawImage(roadImg, 0, roadY, canvas.width, canvas.height);
        ctx.drawImage(roadImg, 0, roadY - canvas.height, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#333"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f1c40f";
        for (let i = -canvas.height; i < canvas.height; i += 70) {
          ctx.fillRect(canvas.width / 2 - 3, i + (roadY % 70), 6, 35);
        }
      }

      spawnCoin();
      for (let i = coins.length - 1; i >= 0; i--) {
        let c = coins[i];
        c.y += roadSpeed;

        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size / 2, 0, Math.PI * 2);
        ctx.fillStyle = "#f39c12"; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.font = "bold 12px Arial"; ctx.textAlign = "center";
        ctx.fillText("$", c.x, c.y + 4);

        if (Math.hypot((playerX + carWidth / 2) - c.x, (playerY + carHeight / 2) - c.y) < carWidth / 2 + c.size / 2) {
          money += c.value;
          score += 5;
          localStorage.setItem("carRace_money", money);
          coins.splice(i, 1);
        } else if (c.y > canvas.height + 20) {
          coins.splice(i, 1);
        }
      }

      // رسم سيارة اللاعب
      const playerModel = allCars.find(c => c.id === currentCar);
      renderCarVehicle(playerModel.img, playerX, playerY, carWidth, carHeight, playerModel.color, true, playerVx);

      const playerObj = { x: playerX, y: playerY, w: carWidth, h: carHeight };

      // تحديث ورسم سيارات الهجوم وتطبيق التصادم الملموس
      for (let attacker of attackerCars) {
        attacker.update(playerX);
        renderCarVehicle(attacker.model.img, attacker.x, attacker.y, attacker.w, attacker.h, attacker.model.color, false, attacker.vx);

        const attackerObj = { x: attacker.x, y: attacker.y, w: attacker.w, h: attacker.h };

        // فحص التصادم الهيكلي الدقيق
        if (checkNodeCollision(playerObj, attackerObj)) {
          createCrashSparks(playerX + carWidth / 2, playerY + carHeight / 4);
          endGame();
        }
      }

      // رسم شرارات الاصطدام
      for (let i = sparks.length - 1; i >= 0; i--) {
        let s = sparks[i];
        ctx.fillStyle = `rgba(255, ${Math.floor(s.life * 255)}, 0, ${s.life})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        s.x += s.vx; s.y += s.vy; s.life -= 0.05;
        if (s.life <= 0) sparks.splice(i, 1);
      }

      const t = i18n[currentLang];
      ctx.fillStyle = "white"; ctx.font = "bold 15px Arial";
      if (currentLang === "ar") {
        ctx.textAlign = "right";
        ctx.fillText(`${t.money}${money}`, canvas.width - 15, 30);
        ctx.fillText(`${t.score} ${score}`, canvas.width - 15, 55);
        ctx.fillText(`${t.highScore} ${highScore}`, canvas.width - 15, 80);
        ctx.fillText(`${t.level} ${level}`, canvas.width - 15, 105);
      } else {
        ctx.textAlign = "left";
        ctx.fillText(`${t.money}${money}`, 15, 30);
        ctx.fillText(`${t.score} ${score}`, 15, 55);
        ctx.fillText(`${t.highScore} ${highScore}`, 15, 80);
        ctx.fillText(`${t.level} ${level}`, 15, 105);
      }

      requestAnimationFrame(drawGame);
    }

    function endGame() {
      gameOver = true;
      bgMusic.pause();
      try { crashSound.play(); } catch(e){}

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("carRace_highScore", highScore);
      }

      setTimeout(() => {
        const t = i18n[currentLang];
        alert(t.gameOver + score + "\n" + t.money + money + "\n" + t.highScore + highScore);
        startScreen.style.display = "block";
        canvas.style.display = "none";
        updateCarButtons();
      }, 100);
    }

    document.onkeydown = (e) => {
      if (gameOver || paused) return;
      let step = 22;
      if (e.key === "ArrowLeft" && playerX > 0) { playerX -= step; playerVx = -5; }
      if (e.key === "ArrowRight" && playerX < canvas.width - carWidth) { playerX += step; playerVx = 5; }
      if (e.key === "ArrowUp" && playerY > 0) playerY -= step;
      if (e.key === "ArrowDown" && playerY < canvas.height - carHeight) playerY += step;
    };
    document.onkeyup = () => { playerVx = 0; };

    function handleTouch(e) {
      if (gameOver || paused) return;
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      let targetX = (touch.clientX - rect.left) - carWidth / 2;
      playerVx = targetX - playerX;
      playerX = Math.max(0, Math.min(canvas.width - carWidth, targetX));
      playerY = Math.max(0, Math.min(canvas.height - carHeight, (touch.clientY - rect.top) - carHeight / 2));
    }

    canvas.addEventListener("touchmove", (e) => { handleTouch(e); e.preventDefault(); }, { passive: false });
    canvas.addEventListener("touchstart", (e) => handleTouch(e), { passive: true });
    canvas.addEventListener("touchend", () => { playerVx = 0; });

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      if (paused) {
        bgMusic.pause();
        controlPanel.style.display = "block";
      } else {
        try { bgMusic.play(); } catch(e){}
        controlPanel.style.display = "none";
        drawGame();
      }
    }

    pauseBtn.onclick = togglePause;
    restartBtn.onclick = () => { resetGame(); try { bgMusic.play(); } catch(e){} drawGame(); };
    startBtn.onclick = () => { startScreen.style.display = "none"; canvas.style.display = "block"; resetGame(); try { bgMusic.play(); } catch(e){} drawGame(); };

    setLanguage("ar");
  </script>
</body>
</html>
