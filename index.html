<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>🎮 مركز الألعاب: التصادم والحظ</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0d0d0d;
    font-family:Arial,"Segoe UI",sans-serif;
    user-select:none;
    -webkit-user-select:none;
}

canvas{
    display:none;
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    touch-action:none;
}

.overlay-card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:92%;
    max-width:430px;
    max-height:94vh;

    overflow-y:auto;

    padding:18px;

    text-align:center;

    color:white;

    background:rgba(15,15,15,.97);

    border:2px solid #e74c3c;
    border-radius:15px;

    box-shadow:
        0 0 25px rgba(231,76,60,.4);

    z-index:20;
}

.lang-container{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:10px;
}

.lang-btn{
    padding:7px 14px;
    background:#222;
    color:white;
    border:1px solid #555;
    border-radius:7px;
    cursor:pointer;
    font-size:13px;
}

.lang-btn.active{
    background:#e74c3c;
    border-color:gold;
    font-weight:bold;
}

.money-badge{
    display:inline-block;
    margin:7px 0;
    padding:7px 15px;
    background:#27ae60;
    border:1px solid #2ecc71;
    border-radius:20px;
    font-weight:bold;
}

.free-badge{
    display:inline-block;
    margin:7px 0;
    padding:7px 15px;
    background:#8e44ad;
    border:1px solid #be90d4;
    border-radius:20px;
    font-weight:bold;
    color:gold;
}

.menu-btn{
    margin:5px;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:linear-gradient(45deg, #e74c3c, #c0392b);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.menu-btn:active,
.car-btn:active,
.lang-btn:active,
.casino-btn:active{
    transform:scale(.96);
}

.car-shop{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:8px;
    margin:8px 0;
}

.car-btn{
    min-height:60px;
    padding:8px;
    border:1px solid #444;
    border-radius:8px;
    color:white;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
    white-space:pre-line;
}

.road-shop-box{
    margin:10px 0;
    padding:10px;
    background:#1a1a1a;
    border:1px dashed #f39c12;
    border-radius:10px;
    touch-action:pan-y;
}

.swipe-hint{
    margin-top:3px;
    color:#888;
    font-size:11px;
}

#startBtn{
    width:80%;
    margin-top:8px;
    font-size:17px;
}

#controlPanel{
    display:none;
}

.hub-btn {
    width: 100%;
    padding: 16px;
    margin: 10px 0;
    font-size: 18px;
    border-radius: 12px;
    border: 2px solid #f39c12;
    background: linear-gradient(45deg, #2c3e50, #34495e);
    color: gold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

.slot-machine {
    background: #111;
    border: 3px solid gold;
    border-radius: 12px;
    padding: 15px;
    margin: 15px 0;
}

.reels-container {
    display: flex;
    justify-content: space-around;
    background: #000;
    border: 2px solid #444;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 15px;
}

.reel {
    width: 30%;
    height: 70px;
    background: #222;
    border: 1px solid gold;
    border-radius: 6px;
    font-size: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
}

.bet-controls {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 12px;
}

.bet-btn {
    padding: 6px 12px;
    background: #333;
    color: white;
    border: 1px solid #777;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}

.bet-btn.active {
    background: #f1c40f;
    color: black;
    font-weight: bold;
    border-color: white;
}

#spinBtn {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    background: linear-gradient(45deg, #f1c40f, #f39c12);
    color: black;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.casino-msg {
    margin-top: 10px;
    font-size: 14px;
    min-height: 20px;
    color: #2ecc71;
    font-weight: bold;
    line-height: 1.5;
}

.nav-back-btn {
    background: #555;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 10px;
    font-size: 12px;
}

.name-chip {
    background: #333;
    color: gold;
    border: 1px solid #555;
    padding: 4px 10px;
    border-radius: 15px;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.name-chip span {
    color: #e74c3c;
    cursor: pointer;
    font-weight: bold;
}

</style>
</head>

<body>

<!-- الشاشة الرئيسية (مركز الألعاب) -->
<div id="hubScreen" class="overlay-card">
    <div class="lang-container">
        <button id="hubLangAr" class="lang-btn active">🇸🇦 العربية</button>
        <button id="hubLangEn" class="lang-btn">🇬🇧 English</button>
    </div>

    <h2 id="hubTitle">🎰 صالة الألعاب 🏎️</h2>
    <div id="hubMoneyTxt" class="money-badge">💰 النقود: $0</div>

    <button id="goToCarGameBtn" class="hub-btn">
        🏎️ لعبة النجاة من التصادم
    </button>

    <button id="goToCasinoBtn" class="hub-btn" style="border-color: #2ecc71; color: #2ecc71;">
        🎰 لعبة الرهان والحظ (ماكينة السلوت)
    </button>

    <button id="goToWheelBtn" class="hub-btn" style="border-color: #9b59b6; color: #be90d4;">
        🎡 عجلة الأسماء والتحديات (مجانية)
    </button>

    <button id="hubCheatBtn" class="menu-btn" style="background: linear-gradient(45deg, #8e44ad, #9b59b6); border: 1px solid #be90d4; margin-top:15px; width:100%;">
        🔑 شحن العملات
    </button>
</div>

<!-- شاشة لعبة القمار (ماكينة السلوت) -->
<div id="casinoScreen" class="overlay-card" style="display:none; border-color: gold; box-shadow: 0 0 25px rgba(241,196,15,.4);">
    <button id="casinoBackBtn" class="nav-back-btn">⬅️ القائمة الرئيسية</button>
    
    <h2 id="casinoTitle">🎰 ماكينة الحظ والرهان</h2>
    <div id="casinoMoneyTxt" class="money-badge">💰 النقود: $0</div>

    <div class="slot-machine">
        <div class="reels-container">
            <div id="reel1" class="reel">7️⃣</div>
            <div id="reel2" class="reel">🎰</div>
            <div id="reel3" class="reel">🪙</div>
        </div>

        <p style="margin:5px; font-size:12px; color:#aaa;" id="betLabel">اختر قيمة الرهان:</p>
        <div class="bet-controls">
            <button class="bet-btn active" onclick="setBet(10)">$10</button>
            <button class="bet-btn" onclick="setBet(50)">$50</button>
            <button class="bet-btn" onclick="setBet(100)">$100</button>
            <button class="bet-btn" onclick="setBet('max')">MAX</button>
        </div>

        <button id="spinBtn" onclick="spinSlots()">🎲 تدوير (سحب)</button>
        <div id="casinoMsg" class="casino-msg"></div>
    </div>
</div>

<!-- شاشة لعبة عجلة الأسماء والتحديات -->
<div id="wheelScreen" class="overlay-card" style="display:none; border-color: #9b59b6; box-shadow: 0 0 25px rgba(155,89,182,.4);">
    <button id="wheelBackBtn" class="nav-back-btn">⬅️ القائمة الرئيسية</button>

            <button id="addNameBtn" class="bet-btn" onclick="addWheelName()" style="background:#8e44ad; color:white; font-weight:bold;">➕ إضافة</button>
        </div>
        <div id="namesList" style="display:flex; flex-wrap:wrap; gap:4px; justify-content:center; max-height:60px; overflow-y:auto; padding:4px; background:#111; border-radius:6px; border:1px solid #333;">

        <img src="h.png" alt="Wheel Frame" style="position:absolute; top:0; left:0; width:210px; height:210px; z-index:10; pointer-events:none;" onerror="this.style.display='none'">
        
        <!-- عجلة الحظ الدائرية (canvas) بداخل الإطار تماماً -->
        <canvas id="wheelCanvas" width="136" height="136" style="background:transparent; border-radius:50%; z-index:11;"></canvas>

    </div>
