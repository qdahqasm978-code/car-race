<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏎️ Car Race Game</title>
  <style>
    body { background-color: black; margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: none; background-color: #333; border: 2px solid white; width: 100vw; height: 100vh; }
    
    /* زر اختيار اللغة */
    .lang-switcher { position: absolute; top: 15px; left: 15px; z-index: 100; display: flex; gap: 8px; }
    .lang-btn { padding: 6px 12px; font-size: 14px; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background: #ff0000; border-color: #ff0000; font-weight: bold; }

    #startScreen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; width: 90%; }
    button { margin: 8px; padding: 12px 24px; font-size: 18px; background: linear-gradient(45deg, #ff0000, #cc0000); color: white; border: none; cursor: pointer; border-radius: 10px; transition: 0.2s; }
    button:active { transform: scale(0.95); }
    
    #controlPanel { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.9); padding: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(255,0,0,0.5); z-index: 20; min-width: 260px; }
    #controlPanel button { display: block; margin: 10px auto; width: 100%; max-width: 220px; }
  </style>
</head>
<body>

  <!-- أزرار تبديل اللغة -->
  <div class="lang-switcher">
    <button class="lang-btn active" id="langAr">🇸🇦 العربية</button>
    <button class="lang-btn" id="langEn">🇬🇧 English</button>
  </div>

  <div id="startScreen">
    <h1 id="titleTxt">🏎️ لعبة سباق السيارات</h1>
    <p id="subTitleTxt">اختر مستوى الصعوبة ثم اضغط تشغيل</p>
    <button id="easyBtn" style="border: 2px solid gold;">😎 سهل</button>
    <button id="hardBtn">🔥 صعب</button>
    <br><br>
    <button id="startBtn">▶ بدء اللعب</button>
  </div>

  <canvas id="gameCanvas"></canvas>
  
  <div id="controlPanel">
    <button id="pauseBtn">⏸ استئناف</button>
    <button id="restartBtn">🔄 إعادة التشغيل</button>
    <hr style="border-color: #555; margin: 15px 0;">
    <p id="selectCarTxt" style="color: white; margin: 5px 0; font-size: 16px;">اختر سيارتك:</p>
    <button id="car2Btn" style="font-size: 15px; padding: 10px;">🔴 الحمراء (Red)</button>
    <button id="car32Btn" style="font-size: 15px; padding: 10px;">🔵 الزرقاء (Blue)</button>
    <button id="carExtraBtn" style="font-size: 15px; padding: 10px;">🟢 الخضراء (Green)</button>
    <button id="car50Btn" style="font-size: 15px; padding: 10px;">⬛ السوداء (Black)</button>
  </div>
  
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");
    const controlPanel = document.getElementById("controlPanel");
    const restartBtn = document.getElementById("restartBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    
    const easyBtn = document.getElementById("easyBtn");
    const hardBtn = document.getElementById("hardBtn");

    const car2Btn = document.getElementById("car2Btn");
    const car32Btn = document.getElementById("car32Btn");
    const carExtraBtn = document.getElementById("carExtraBtn");
    const car50Btn = document.getElementById("car50Btn");

    const langAr = document.getElementById("langAr");
    const langEn = document.getElementById("langEn");

    // نصوص اللغات (i18n)
    let currentLang = "ar";
    const i18n = {
      ar: {
        title: "🏎️ لعبة سباق السيارات",
        subtitle: "اختر مستوى الصعوبة ثم اضغط تشغيل",
        easy: "😎 سهل",
        hard: "🔥 صعب",
        start: "▶ بدء اللعب",
        resume: "⏸ استئناف",
        restart: "🔄 إعادة التشغيل",
        selectCar: "اختر سيارتك:",
        carRed: "🔴 السيارة الحمراء",
        carBlue: "🔵 السيارة الزرقاء",
        carGreen: "🟢 السيارة الخضراء",
        carBlack: "⬛ السيارة السوداء",
        score: "النقاط: ",
        level: "المستوى: ",
        difficulty: "الصعوبة: ",
        gameOver: "💥 انتهت اللعبة!\nالنقاط: ",
        levelText: "\nالمستوى: "
      },
      en: {
        title: "🏎️ Car Race Game",
        subtitle: "Select difficulty then press Start",
        easy: "😎 Easy",
        hard: "🔥 Hard",
        start: "▶ Start",
        resume: "⏸ Resume",
        restart: "🔄 Restart",
        selectCar: "Choose Your Car:",
        carRed: "🔴 Red Car",
        carBlue: "🔵 Blue Car",
        carGreen: "🟢 Green Car",
        carBlack: "⬛ Black Car",
        score: "Score: ",
        level: "Level: ",
        difficulty: "Difficulty: ",
        gameOver: "💥 Game Over!\nScore: ",
        levelText: "\nLevel: "
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      
      langAr.classList.toggle("active", lang === "ar");
      langEn.classList.toggle("active", lang === "en");

      const t = i18n[lang];
      document.getElementById("titleTxt").innerText = t.title;
      document.getElementById("subTitleTxt").innerText = t.subtitle;
      easyBtn.innerText = t.easy;
      hardBtn.innerText = t.hard;
      startBtn.innerText = t.start;
      pauseBtn.innerText = t.resume;
      restartBtn.innerText = t.restart;
      document.getElementById("selectCarTxt").innerText = t.selectCar;

      car2Btn.innerText = t.carRed;
      car32Btn.innerText = t.carBlue;
      carExtraBtn.innerText = t.carGreen;
      car50Btn.innerText = t.carBlack;
    }

    langAr.onclick = () => setLanguage("ar");
    langEn.onclick = () => setLanguage("en");

    let difficulty = "easy"; 
    let paused = false;
    let gameOver = false;
    let currentCar = "car2";
    let roadY = 0; 
    let wakeLock = null;

    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    easyBtn.onclick = () => { difficulty = "easy"; easyBtn.style.border = "2px solid gold"; hardBtn.style.border = "none"; };
    hardBtn.onclick = () => { difficulty = "hard"; hardBtn.style.border = "2px solid gold"; easyBtn.style.border = "none"; };

    car2Btn.onclick = () => { currentCar = "car2"; togglePause(); };
    car32Btn.onclick = () => { currentCar = "car32"; togglePause(); };
    carExtraBtn.onclick = () => { currentCar = "carExtra"; togglePause(); };
    car50Btn.onclick = () => { currentCar = "car50"; togglePause(); };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    // تحميل الصور مع حماية في حال عدم توفر الصورة
    const carImg = new Image(); carImg.src = "car2.png";
    const roadImg = new Image(); roadImg.src = "road.png";
    const car32Img = new Image(); car32Img.src = "car32.png";
    const carExtraImg = new Image(); carExtraImg.src = "carExtra.png";
    const car50Img = new Image(); car50Img.src = "car50.png";

    const bgMusic = new Audio("background.mp3");
    bgMusic.loop = true;
    const crashSound = new Audio("explosion.mp3");

    let carX, carY, car32X, car32Y, carExtraX, carExtraY;
    let score, level;
    const carWidth = 70;
    const carHeight = 140;

    // دالة رسم سيارة احترافية بالـ Canvas بديلة في حال عدم وجود صور
    function drawFallbackCar(x, y, width, height, bodyColor, isFlipped = false) {
      ctx.save();
      ctx.translate(x + width / 2, y + height / 2);
      if (isFlipped) ctx.rotate(Math.PI);

      // جسم السيارة الرئيسي
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.roundRect(-width / 2, -height / 2, width, height, 15);
      ctx.fill();

      // الزجاج الأمامي والخلفي
      ctx.fillStyle = "#87CEEB";
      ctx.fillRect(-width / 2 + 8, -height / 4, width - 16, height / 5); // زجاج أمامي
      ctx.fillRect(-width / 2 + 10, height / 4, width - 20, height / 8); // زجاج خلفي

      // الإطارات الأربعة
      ctx.fillStyle = "#111";
      ctx.fillRect(-width / 2 - 4, -height / 3, 6, 25);
      ctx.fillRect(width / 2 - 2, -height / 3, 6, 25);
      ctx.fillRect(-width / 2 - 4, height / 4, 6, 25);
      ctx.fillRect(width / 2 - 2, height / 4, 6, 25);

      // الأضواء الأمامية
      ctx.fillStyle = "#FFF";
      ctx.fillRect(-width / 2 + 6, -height / 2, 12, 6);
      ctx.fillRect(width / 2 - 18, -height / 2, 12, 6);

      ctx.restore();
    }

    // دالة عامة لتمثيل وقراءة السيارات (صورة أو رسم جاهز)
    function renderCar(img, x, y, width, height, color, isFlipped = false) {
      if (img.complete && img.naturalWidth !== 0) {
        ctx.save();
        ctx.translate(x + width / 2, y + height / 2);
        if (isFlipped) ctx.rotate(Math.PI);
        ctx.drawImage(img, -width / 2, -height / 2, width, height);
        ctx.restore();
      } else {
        drawFallbackCar(x, y, width, height, color, isFlipped);
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    function resetGame() {
      resizeCanvas();
      carX = canvas.width / 2 - carWidth / 2;
      carY = canvas.height / 2 - carHeight / 2; 
      
      roadY = 0;
      car32X = Math.random() * (canvas.width - carWidth);
      car32Y = -160;
      carExtraX = Math.random() * (canvas.width - carWidth);
      carExtraY = -400;
      window.car50X = Math.random() * (canvas.width - carWidth);
      window.car50Y = -600;
      score = 0;
      level = 1;
      gameOver = false;
      paused = false;
      controlPanel.style.display = "none";
    }

    function checkCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
      const shrinkW1 = w1 * 0.5;
      const shrinkH1 = h1 * 0.5;
      const shrinkW2 = w2 * 0.5;
      const shrinkH2 = h2 * 0.5;

      const offsetX1 = x1 + (w1 - shrinkW1) / 2;
      const offsetY1 = y1 + (h1 - shrinkH1) / 2;
      const offsetX2 = x2 + (w2 - shrinkW2) / 2;
      const offsetY2 = y2 + (h2 - shrinkH2) / 2;

      return (
        offsetX1 < offsetX2 + shrinkW2 &&
        offsetX1 + shrinkW1 > offsetX2 &&
        offsetY1 < offsetY2 + shrinkH2 &&
        offsetY1 + shrinkH1 > offsetY2
      );
    }

    function drawGame() {
      if (gameOver || paused) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let scrollSpeed = (difficulty === "easy" ? 4 : 6) + level;
      roadY += scrollSpeed;
      if (roadY >= canvas.height) roadY = 0;

      if (roadImg.complete && roadImg.naturalWidth !== 0) {
        ctx.drawImage(roadImg, 0, roadY, canvas.width, canvas.height);
        ctx.drawImage(roadImg, 0, roadY - canvas.height, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#333";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#FFF";
        for (let i = -canvas.height; i < canvas.height; i += 80) {
          ctx.fillRect(canvas.width / 2 - 4, i + (roadY % 80), 8, 40);
        }
      }

      // 🔴 السيارة الحمراء (Car 2)
      // 🔵 السيارة الزرقاء (Car 32)
      // 🟢 السيارة الخضراء (Car Extra)
      // ⬛ السيارة السوداء (Car 50)
      if (currentCar === "car2") renderCar(carImg, carX, carY, carWidth, carHeight, "#e74c3c", false);
      else if (currentCar === "car32") renderCar(car32Img, carX, carY, carWidth, carHeight, "#3498db", true);
      else if (currentCar === "carExtra") renderCar(carExtraImg, carX, carY, carWidth, carHeight, "#2ecc71", true);
      else if (currentCar === "car50") renderCar(car50Img, carX, carY, carWidth, carHeight, "#2c3e50", true);

      // رسم سيارات الأعداء
      if (currentCar !== "car32") renderCar(car32Img, car32X, car32Y, carWidth, carHeight, "#3498db", false);
      if (currentCar !== "carExtra") renderCar(carExtraImg, carExtraX, carExtraY, carWidth, carHeight, "#2ecc71", false);

      let baseSpeed32 = (difficulty === "easy") ? 2 : 3;
      let baseSpeedExtra = (difficulty === "easy") ? 3 : 4.5;

      if (difficulty === "hard") {
        if (car32X < carX) car32X += 0.9;
        else if (car32X > carX) car32X -= 0.9;
        
        if (carExtraX < carX) carExtraX += 1.2;
        else if (carExtraX > carX) carExtraX -= 1.2;

        if (window.car50X < carX) window.car50X += 1.4;
        else if (window.car50X > carX) window.car50X -= 1.4;
      }

      car32Y += baseSpeed32 + level;
      if (car32Y > canvas.height) {
        car32Y = -160;
        car32X = Math.random() * (canvas.width - carWidth);
        score++;
      }

      carExtraY += baseSpeedExtra + level;
      if (carExtraY > canvas.height) {
        carExtraY = -160;
        carExtraX = Math.random() * (canvas.width - carWidth);
        score++;
      }

      if (difficulty === "hard") {
        if (currentCar !== "car50") {
          renderCar(car50Img, window.car50X, window.car50Y, carWidth, carHeight, "#2c3e50", false);
        }
        window.car50Y += 4.5 + level;
        if (window.car50Y > canvas.height) {
          window.car50Y = -160;
          window.car50X = Math.random() * (canvas.width - carWidth);
          score++;
        }
        if (currentCar !== "car50" && checkCollision(carX, carY, carWidth, carHeight, window.car50X, window.car50Y, carWidth, carHeight)) {
          endGame();
        }
      }

      if (score > 0 && score % 10 === 0) {
        level = Math.floor(score / 10) + 1;
      }

      // طباعة النصوص والنقاط حسب اللغة
      const t = i18n[currentLang];
      ctx.fillStyle = "white";
      ctx.font = "bold 18px Arial";
      ctx.fillText(t.score + score, 20, 40);
      ctx.fillText(t.level + level, 20, 70);
      ctx.fillText(t.difficulty + difficulty.toUpperCase(), 20, 100);

      let crashWith32 = (currentCar !== "car32" && checkCollision(carX, carY, carWidth, carHeight, car32X, car32Y, carWidth, carHeight));
      let crashWithExtra = (currentCar !== "carExtra" && checkCollision(carX, carY, carWidth, carHeight, carExtraX, carExtraY, carWidth, carHeight));

      if (crashWith32 || crashWithExtra) {
        endGame();
      }

      requestAnimationFrame(drawGame);
    }

    function endGame() {
      gameOver = true;
      bgMusic.pause();
      try { crashSound.play(); } catch(e){}
      releaseWakeLock(); 

      const t = i18n[currentLang];
      alert(t.gameOver + score + t.levelText + level);
      controlPanel.style.display = "block"; 
      pauseBtn.style.display = "none";
      restartBtn.style.display = "block";
    }

    document.onkeydown = (e) => {
      if (gameOver || paused) return;
      let moveStep = (difficulty === "easy") ? 25 : 20;
      if (e.key === "ArrowLeft" && carX > 0) carX -= moveStep;
      if (e.key === "ArrowRight" && carX < canvas.width - carWidth) carX += moveStep;
      if (e.key === "ArrowUp" && carY > 0) carY -= moveStep; 
      if (e.key === "ArrowDown" && carY < canvas.height - carHeight) carY += moveStep; 
    };

    function handleTouch(e) {
      if (gameOver || paused) return;
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      carX = (touch.clientX - rect.left) - carWidth / 2;
      carY = (touch.clientY - rect.top) - carHeight / 2;

      if (carX < 0) carX = 0;
      if (carX > canvas.width - carWidth) carX = canvas.width - carWidth;
      if (carY < 0) carY = 0;
      if (carY > canvas.height - carHeight) carY = canvas.height - carHeight;
    }

    canvas.addEventListener("touchstart", (e) => {
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      touchStartTime = Date.now();
      handleTouch(e);
    }, {passive: true});

    canvas.addEventListener("touchmove", (e) => {
      handleTouch(e);
      e.preventDefault(); 
    }, { passive: false });

    canvas.addEventListener("touchend", (e) => {
      const touch = e.changedTouches[0];
      const moveDistance = Math.hypot(touch.clientX - touchStartX, touch.clientY - touchStartY);
      const touchDuration = Date.now() - touchStartTime;

      if (touchDuration < 200 && moveDistance < 15) {
        togglePause();
      }
    });

    canvas.onclick = () => {
      togglePause();
    };

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      if (paused) {
        bgMusic.pause();
        releaseWakeLock(); 
        controlPanel.style.display = "block";
        pauseBtn.style.display = "block";
        restartBtn.style.display = "block";
      } else {
        try { bgMusic.play(); } catch(e){}
        requestWakeLock(); 
        controlPanel.style.display = "none";
        drawGame();
      }
    }

    pauseBtn.onclick = togglePause;

    restartBtn.onclick = () => {
      resetGame();
      try { bgMusic.play(); } catch(e){}
      requestWakeLock(); 
      drawGame();
    };

    startBtn.onclick = () => {
      startScreen.style.display = "none";
      canvas.style.display = "block";
      resetGame();
      try { bgMusic.play(); } catch(e){}
      requestWakeLock(); 
      drawGame();
    };

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && !paused && !gameOver) {
        await requestWakeLock();
      }
    });

    window.addEventListener("deviceorientation", (event) => {
      if (gameOver || paused) return;
      const tiltX = event.gamma; 
      const tiltY = event.beta;  
      let moveStep = (difficulty === "easy") ? 8 : 5;

      if (tiltX < -6 && carX > 0) carX -= moveStep;
      if (tiltX > 6 && carX < canvas.width - carWidth) carX += moveStep;
      if (tiltY < 40 && carY > 0) carY -= moveStep; 
      if (tiltY > 60 && carY < canvas.height - carHeight) carY += moveStep; 
    });
  </script>
</body>
</html>
