<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0d0d0d;
    font-family:Arial,"Segoe UI",sans-serif;
    user-select:none;
    -webkit-user-select:none;
}

canvas{
    display:none;
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    touch-action:none;
}

.overlay-card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:92%;
    max-width:430px;
    max-height:94vh;

    overflow-y:auto;

    padding:18px;

    text-align:center;

    color:white;

    background:rgba(15,15,15,.97);

    border:2px solid #e74c3c;
    border-radius:15px;

    box-shadow:
        0 0 25px rgba(231,76,60,.4);

    z-index:20;
}

.lang-container{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:10px;
}

.lang-btn{
    padding:7px 14px;
    background:#222;
    color:white;
    border:1px solid #555;
    border-radius:7px;
    cursor:pointer;
    font-size:13px;
}

.lang-btn.active{
    background:#e74c3c;
    border-color:gold;
    font-weight:bold;
}

.money-badge{
    display:inline-block;
    margin:7px 0;
    padding:7px 15px;
    background:#27ae60;
    border:1px solid #2ecc71;
    border-radius:20px;
    font-weight:bold;
}

.free-badge{
    display:inline-block;
    margin:7px 0;

    background:#8e44ad;
    border:1px solid #be90d4;
    border-radius:20px;
    font-weight:bold;
    color:gold;
}

.menu-btn{
    margin:5px;
    padding:10px 18px;

    border-radius:8px;
    background:linear-gradient(45deg, #e74c3c, #c0392b);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.menu-btn:active,
.car-btn:active,
.lang-btn:active,

}

.car-shop{

.car-btn{

.swipe-hint{

#startBtn{

const SECRET_SALT = "CR_GAME_HUB_SECURE_2026_#987";

function generateSecuritySig(m, hs, cars, roads) {
    const dataStr = `${m}_${hs}_${JSON.stringify(cars)}_${JSON.stringify(roads)}_${SECRET_SALT}`;
    let hash = 0;
    for (let i = 0; i < dataStr.length; i++) {
        const char = dataStr.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash |= 0;
    }
    return hash.toString(16);
}

function loadSecureData() {
    let rawMoney = Number(localStorage.getItem("carRace_money")) || 0;
    let rawHighScore = Number(localStorage.getItem("carRace_highScore")) || 0;
    let rawCars, rawRoads;

    try { rawCars = JSON.parse(localStorage.getItem("carRace_unlockedCars")) || ["car2"]; } catch { rawCars = ["car2"]; }
    try { rawRoads = JSON.parse(localStorage.getItem("carRace_unlockedRoads")) || ["road"]; } catch { rawRoads = ["road"]; }

    const savedSig = localStorage.getItem("carRace_sig");
    const expectedSig = generateSecuritySig(rawMoney, rawHighScore, rawCars, rawRoads);

    if (savedSig && savedSig !== expectedSig) {
        rawMoney = 0;
        localStorage.setItem("carRace_money", 0);
        saveMoney();
    }

    return {
        money: rawMoney < 0 ? 0 : rawMoney,
        highScore: rawHighScore < 0 ? 0 : rawHighScore,
        unlockedCars: rawCars,
        unlockedRoads: rawRoads
    };
}

const secureData = loadSecureData();

let unlockedCars = secureData.unlockedCars;

function saveMoney() {
    localStorage.setItem("carRace_money", money);
    localStorage.setItem("carRace_highScore", highScore);
    localStorage.setItem("carRace_unlockedCars", JSON.stringify(unlockedCars));
    localStorage.setItem("carRace_unlockedRoads", JSON.stringify(unlockedRoads));
    localStorage.setItem("carRace_sig", generateSecuritySig(money, highScore, unlockedCars, unlockedRoads));
    updateAllMoneyDisplays();
}

function updateAllMoneyDisplays() {
    const t = i18n[currentLang];
    document.getElementById("hubMoneyTxt").innerText = t.money + money;
    document.getElementById("casinoMoneyTxt").innerText = t.money + money;
    document.getElementById("startMoneyTxt").innerText = t.money + money;
}

function showScreen(screenId) {
    hubScreen.style.display = "none";
    casinoScreen.style.display = "none";
    wheelScreen.style.display = "none";
    startScreen.style.display = "none";
    canvas.style.display = "none";
    controlPanel.style.display = "none";

    if(screenId === "casino") casinoScreen.style.display = "block";
    if(screenId === "wheel") { wheelScreen.style.display = "block"; drawWheel(); }
    if(screenId === "carStart") startScreen.style.display = "block";
    if(screenId === "canvas") canvas.style.display = "block";
    
    updateAllMoneyDisplays();
}

/* عجلة الأسماء والتحديات */
let wheelNames = [];
let wheelColors = ["#e74c3c", "#3498db", "#2ecc71", "#f1c40f", "#9b59b6", "#e67e22", "#1abc9c", "#e84393"];
let wheelAngle = 0;
let isWheelSpinning = false;

const wheelCanvas = document.getElementById("wheelCanvas");
const wheelCtx = wheelCanvas.getContext("2d");

function renderNameChips() {
    const listEl = document.getElementById("namesList");
    listEl.innerHTML = "";
    
    if(wheelNames.length === 0) {
        listEl.innerHTML = `<span style="color:#777; font-size:12px; padding:4px;">${currentLang === "ar" ? "لا توجد أسماء مضافة بعد" : "No names added yet"}</span>`;
    } else {
        wheelNames.forEach((name, index) => {
            const chip = document.createElement("div");
            chip.className = "name-chip";
            chip.innerHTML = `${name} <span onclick="removeWheelName(${index})">✖</span>`;
            listEl.appendChild(chip);
        });
    }
    drawWheel();
}

function addWheelName() {
    if(isWheelSpinning) return;
    const input = document.getElementById("nameInput");
    const name = input.value.trim();
    if(name !== "" && !wheelNames.includes(name)) {
        wheelNames.push(name);
        input.value = "";
        renderNameChips();
    }
}

function removeWheelName(index) {
    if(isWheelSpinning) return;
    if(wheelNames.length > 0) {
        wheelNames.splice(index, 1);
        renderNameChips();
    }
}

function drawWheel() {
    const numSlices = wheelNames.length;
    const centerX = wheelCanvas.width / 2;
    const centerY = wheelCanvas.height / 2;
    const radius = centerX - 5;

    wheelCtx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);

    if(numSlices === 0) {
        wheelCtx.beginPath();
        wheelCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        wheelCtx.fillStyle = "#222";
        wheelCtx.fill();
        wheelCtx.lineWidth = 2;
        wheelCtx.strokeStyle = "#8e44ad";
        wheelCtx.stroke();

        wheelCtx.fillStyle = "#aaa";
        wheelCtx.font = "bold 13px Arial";
        wheelCtx.textAlign = "center";
        wheelCtx.fillText(currentLang === "ar" ? "أضف أسماءً للبدء" : "Add names to start", centerX, centerY + 5);
        return;
    }

    const sliceAngle = (Math.PI * 2) / numSlices;

    for(let i = 0; i < numSlices; i++) {
        const startAngle = wheelAngle + i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        wheelCtx.beginPath();
        wheelCtx.moveTo(centerX, centerY);
        wheelCtx.arc(centerX, centerY, radius, startAngle, endAngle);
        wheelCtx.fillStyle = wheelColors[i % wheelColors.length];
        wheelCtx.fill();
        wheelCtx.lineWidth = 2;
        wheelCtx.strokeStyle = "#fff";
        wheelCtx.stroke();

        wheelCtx.save();
        wheelCtx.translate(centerX, centerY);
        wheelCtx.rotate(startAngle + sliceAngle / 2);
        wheelCtx.textAlign = "right";
        wheelCtx.fillStyle = "#fff";
        wheelCtx.font = "bold 13px Arial";
        wheelCtx.shadowColor = "#000";
        wheelCtx.shadowBlur = 4;
        wheelCtx.fillText(wheelNames[i], radius - 15, 5);
        wheelCtx.restore();
    }
}

function spinWheel() {
    if(isWheelSpinning) return;

    if(wheelNames.length < 2) {
        document.getElementById("wheelMsg").innerText = i18n[currentLang].minNamesErr;
        document.getElementById("wheelMsg").style.color = "#e74c3c";
        return;
    }

    const reqText = document.getElementById("wheelReqInput").value.trim();
    if(reqText === "") {
        document.getElementById("wheelMsg").innerText = i18n[currentLang].noReqErr;
        document.getElementById("wheelMsg").style.color = "#e74c3c";
        return;
    }

    isWheelSpinning = true;
    document.getElementById("wheelMsg").innerText = "";

    spinSound.currentTime = 0;
    spinSound.loop = true;
    spinSound.play().catch(() => {});

    const spinRotations = 5 + Math.random() * 5; 
    const totalRotation = spinRotations * Math.PI * 2;
    const duration = 4000;
    const startTime = performance.now();

    function animateWheel(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        wheelAngle = easeOut * totalRotation;
        drawWheel();

        if(progress < 1) {
            requestAnimationFrame(animateWheel);
        } else {
            finishWheelSpin(reqText);
        }
    }

    requestAnimationFrame(animateWheel);
}

function finishWheelSpin(reqText) {
    isWheelSpinning = false;
    spinSound.pause();
    spinSound.currentTime = 0;

    const numSlices = wheelNames.length;
    const sliceAngle = (Math.PI * 2) / numSlices;
    
    let normalizedAngle = (1.5 * Math.PI - (wheelAngle % (Math.PI * 2))) % (Math.PI * 2);
    if(normalizedAngle < 0) normalizedAngle += Math.PI * 2;

    const winningIndex = Math.floor(normalizedAngle / sliceAngle) % numSlices;
    const winningName = wheelNames[winningIndex];

    const msgEl = document.getElementById("wheelMsg");

    if(currentLang === "ar") {
        msgEl.innerHTML = `👑 الفائز بالقرعة: <span style="color:gold;">[${winningName}]</span><br>📌 المطلوب منه: <span style="color:#2ecc71;">${reqText}</span>`;
    } else {
        msgEl.innerHTML = `👑 Chosen Winner: <span style="color:gold;">[${winningName}]</span><br>📌 Assigned Task: <span style="color:#2ecc71;">${reqText}</span>`;
    }
    
    coinSound.currentTime = 0;
    coinSound.play().catch(() => {});
}

let difficulty = "easy";
let paused = false;
let gameOver = false;
let playerX = 0, playerY = 0, playerVx = 0;
let score = 0, level = 1, dodgedCars = 0, roadY = 0;
let coins = [], attackerCars = [], sparks = [];
const carWidth = 52, carHeight = 105;

easyBtn.onclick = () => { difficulty = "easy"; easyBtn.style.border = "2px solid gold"; hardBtn.style.border = "none"; };
hardBtn.onclick = () => { difficulty = "hard"; hardBtn.style.border = "2px solid gold"; easyBtn.style.border = "none"; };

function resizeCanvas(){
    canvas.width = Math.min(window.innerWidth, 480);
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function drawFallbackCar(w, h, color){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-w/2, -h/2, w, h, 8);
    ctx.fill();
    ctx.fillStyle = "#87CEEB";
    ctx.fillRect(-w/2 + 5, -h/4, w - 10, h/4);
}

function renderCar(img, x, y, w, h, color, isPlayer, tilt){
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    let rotation = isPlayer ? 0 : Math.PI;
    rotation += tilt * .03;
    ctx.rotate(rotation);

    if(img.complete && img.naturalWidth > 0){
        ctx.drawImage(img, -w/2, -h/2, w, h);
    } else {
        drawFallbackCar(w, h, color);
    }
    ctx.restore();
}

function getHitbox(x, y, w, h, isPlayer = true){
    const insetX = w * .22;
    let insetYTop = h * .12, insetYBottom = h * .12;

    if(isPlayer){
        insetYTop += h * 0.05;
        insetYBottom += h * 0.15;
    } else {
        insetYBottom += h * 0.05;
        insetYTop += h * 0.15;
    }

    const origW = w - insetX * 2;
    const origH = h - (insetYTop + insetYBottom);
    const boxW = origW * 0.90, boxH = origH * 0.90;

    return { x: x + insetX + (origW - boxW) / 2, y: y + insetYTop + (origH - boxH) / 2, w: boxW, h: boxH };
}

function collision(a, b){
    return (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y);
}

class SmartAICar{
    constructor(model){ this.model = model; this.w = carWidth; this.h = carHeight; this.reset(); }
    reset(){
        this.x = Math.random() * (canvas.width - this.w);
        this.y = -this.h - Math.random() * 400;
        this.baseSpeed = (difficulty === "easy" ? 3.5 : 5.2) + Math.random() * 1.5;
        this.steeringPower = difficulty === "easy" ? .025 : .05;
        this.vx = 0;
    }
    update(){
        const distanceY = playerY - this.y;
        if(distanceY > 0 && distanceY < canvas.height * .75){
            const diffX = playerX - this.x;
            this.vx += (diffX * this.steeringPower - this.vx) * .1;
        } else {
            this.vx *= .9;
        }
        this.x += this.vx;
        this.y += this.baseSpeed + level * .4;
        this.x = Math.max(5, Math.min(canvas.width - this.w - 5, this.x));

        if(this.y > canvas.height + 60){
            this.reset();
            score++;
            dodgedCars++;
            level = Math.floor(dodgedCars / 7) + 1;
        }
    }
}

function setupAttackers(){
    attackerCars = [];
    const opponents = allCars.filter(car => car.id !== currentCar);
    const count = difficulty === "easy" ? 2 : 3;
    for(let i=0; i<count; i++){
        attackerCars.push(new SmartAICar(opponents[i % opponents.length]));
    }
}

function spawnCoin(){
    if(Math.random() < .02 && coins.length < 3){
        coins.push({ x: Math.random() * (canvas.width - 40) + 20, y: -40, value: 10, size: 24 });
    }
}

function createSparks(x, y){
    for(let i=0; i<35; i++){
        sparks.push({
            x: x, y: y,
            vx: (Math.random() - .5) * 16,
            vy: (Math.random() - .5) * 16,
            size: Math.random() * 5 + 2,
            life: 1
        });
    }
}

function resetGame(){
    resizeCanvas();
    playerX = canvas.width / 2 - carWidth / 2;
    playerY = canvas.height - carHeight - 30;
    playerVx = 0; roadY = 0; score = 0; level = 1; dodgedCars = 0;
    coins = []; sparks = [];
    gameOver = false; paused = false;
    controlPanel.style.display = "none";
    setupAttackers();
}

function drawGame(){
    if(gameOver || paused) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const roadSpeed = (difficulty === "easy" ? 6 : 8) + level;
    roadY = (roadY + roadSpeed) % canvas.height;

    const activeRoad = allRoads.find(road => road.id === currentRoad) || allRoads[0];
    const roadImage = activeRoad.img;

    if(roadImage.complete && roadImage.naturalWidth > 0){
        ctx.drawImage(roadImage, 0, roadY, canvas.width, canvas.height);
        ctx.drawImage(roadImage, 0, roadY - canvas.height, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = currentRoad === "desert" ? "#c87520" : currentRoad === "snow" ? "#9eb5c7" : "#333";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f1c40f";
        for(let y=-canvas.height; y<canvas.height; y+=70){
            ctx.fillRect(canvas.width / 2 - 3, y + (roadY % 70), 6, 35);
        }
    }

    spawnCoin();
    for(let i=coins.length-1; i>=0; i--){
        const coin = coins[i];
        coin.y += roadSpeed;

        ctx.beginPath();
        ctx.arc(coin.x, coin.y, coin.size / 2, 0, Math.PI * 2);
        ctx.fillStyle = "#f39c12"; ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.font = "bold 12px Arial"; ctx.textAlign = "center";
        ctx.fillText("$", coin.x, coin.y + 4);

        if(Math.hypot(playerX + carWidth / 2 - coin.x, playerY + carHeight / 2 - coin.y) < carWidth / 2 + coin.size / 2){
            money += coin.value;
            score += 5;
            coinSound.currentTime = 0;
            coinSound.play().catch(() => {});
            saveMoney();
            coins.splice(i, 1);
        } else if(coin.y > canvas.height + 20){
            coins.splice(i, 1);
        }
    }

    const playerModel = allCars.find(car => car.id === currentCar) || allCars[0];
    renderCar(playerModel.img, playerX, playerY, carWidth, carHeight, playerModel.color, true, playerVx);
    const playerBox = getHitbox(playerX, playerY, carWidth, carHeight, true);

    for(const attacker of attackerCars){
        attacker.update();
        renderCar(attacker.model.img, attacker.x, attacker.y, attacker.w, attacker.h, attacker.model.color, false, attacker.vx);
        const enemyBox = getHitbox(attacker.x, attacker.y, attacker.w, attacker.h, false);

        if(collision(playerBox, enemyBox)){
            createSparks((playerBox.x + enemyBox.x) / 2, (playerBox.y + enemyBox.y) / 2);
            endGame();
            return;
        }
    }

    for(let i=sparks.length-1; i>=0; i--){
        const spark = sparks[i];
        ctx.fillStyle = `rgba(255, ${Math.floor(spark.life * 255)}, 0, ${spark.life})`;
        ctx.beginPath();
        ctx.arc(spark.x, spark.y, spark.size, 0, Math.PI * 2);
        ctx.fill();
        spark.x += spark.vx; spark.y += spark.vy; spark.life -= .05;
        if(spark.life <= 0) sparks.splice(i, 1);
    }

    const t = i18n[currentLang];
    ctx.fillStyle = "white"; ctx.font = "bold 15px Arial";
    if(currentLang === "ar"){
        ctx.textAlign = "right";
        ctx.fillText(t.money + money, canvas.width - 15, 30);
        ctx.fillText(t.score + " " + score, canvas.width - 15, 55);
        ctx.fillText(t.high + " " + highScore, canvas.width - 15, 80);
        ctx.fillText(t.level + " " + level, canvas.width - 15, 105);
    } else {
        ctx.textAlign = "left";
        ctx.fillText(t.money + money, 15, 30);
        ctx.fillText(t.score + " " + score, 15, 55);
        ctx.fillText(t.high + " " + highScore, 15, 80);
        ctx.fillText(t.level + " " + level, 15, 105);
    }

    requestAnimationFrame(drawGame);
}

function endGame(){
    if(gameOver) return;
    gameOver = true;
    bgMusic.pause();
    crashSound.currentTime = 0;
    crashSound.play().catch(() => {});

    if(score > highScore){
        highScore = score;
    }
    saveMoney();

    setTimeout(() => {
        const t = i18n[currentLang];
        alert(t.crash + "\n" + t.score + " " + score + "\n" + t.money + money + "\n" + t.high + " " + highScore);
        showScreen("carStart");
    }, 300);
}

document.addEventListener("keydown", (e) => {
    if(gameOver || paused) return;
    const step = 22;
    if(e.key === "ArrowLeft") { playerX -= step; playerVx = -5; }
    if(e.key === "ArrowRight") { playerX += step; playerVx = 5; }
    if(e.key === "ArrowUp") playerY -= step;
    if(e.key === "ArrowDown") playerY += step;

    playerX = Math.max(0, Math.min(canvas.width - carWidth, playerX));
    playerY = Math.max(0, Math.min(canvas.height - carHeight, playerY));
});

document.addEventListener("keyup", (e) => {
    if(e.key === "ArrowLeft" || e.key === "ArrowRight") playerVx = 0;
});

function movePlayerTouch(e){
    if(gameOver || paused) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    let targetX = touch.clientX - rect.left - carWidth / 2;
    let targetY = touch.clientY - rect.top - carHeight / 2;

    playerVx = targetX - playerX;
    playerX = Math.max(0, Math.min(canvas.width - carWidth, targetX));
    playerY = Math.max(0, Math.min(canvas.height - carHeight, targetY));
}

canvas.addEventListener("touchstart", movePlayerTouch, {passive:true});
canvas.addEventListener("touchmove", (e) => { movePlayerTouch(e); e.preventDefault(); }, {passive:false});
canvas.addEventListener("touchend", () => playerVx = 0);

function togglePause(){
    if(gameOver) return;
    paused = !paused;

    if(paused){
        bgMusic.pause();
        pauseBtn.innerText = i18n[currentLang].resume;
        controlPanel.style.display = "block";
    } else {
        controlPanel.style.display = "none";
        pauseBtn.innerText = i18n[currentLang].pause;
        bgMusic.play().catch(() => {});
        drawGame();
    }
}

pauseBtn.onclick = togglePause;
restartBtn.onclick = () => { resetGame(); bgMusic.currentTime = 0; bgMusic.play().catch(() => {}); drawGame(); };

startBtn.onclick = () => {
    showScreen("canvas");
    resetGame();
    bgMusic.currentTime = 0;
    bgMusic.play().catch(() => {});
    drawGame();
};

setLanguage("ar");
showScreen("hub");
