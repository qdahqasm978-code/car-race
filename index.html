<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏎️ النجاة من التصادم</title>

  <style>
    body {
      background-color: #0d0d0d;
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      user-select: none;
    }

    canvas {
      display: none;
      background-color: #222;
      margin: 0 auto;
    }

    .overlay-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      width: 90%;
      max-width: 420px;
      z-index: 30;
      background: rgba(15,15,15,0.95);
      padding: 18px;
      border-radius: 15px;
      border: 2px solid #e74c3c;
      box-shadow: 0 0 25px rgba(231,76,60,0.4);
      max-height: 95vh;
      overflow-y: auto;
    }

    .lang-container {
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .lang-btn {
      padding: 6px 14px;
      font-size: 13px;
      background: #222;
      color: white;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: #e74c3c;
      border-color: gold;
      font-weight: bold;
    }

    button.menu-btn {
      margin: 5px;
      padding: 10px 18px;
      font-size: 15px;
      background: linear-gradient(45deg, #e74c3c, #c0392b);
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.2s;
    }

    button.menu-btn:active {
      transform: scale(0.95);
    }

    .car-shop {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 8px 0;
    }

    .car-btn {
      padding: 8px;
      font-size: 12px;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      white-space: pre-line;
    }

    .car-btn:active {
      transform: scale(0.95);
    }

    .road-shop-box {
      background: #1a1a1a;
      border: 1px dashed #f39c12;
      border-radius: 10px;
      padding: 10px;
      margin: 10px 0;
      touch-action: pan-y;
    }

    .road-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .swipe-hint {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .money-badge {
      background: #27ae60;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      display: inline-block;
      margin: 6px 0;
      font-size: 15px;
      border: 1px solid #2ecc71;
    }
  </style>
</head>

<body>

  <div id="startScreen" class="overlay-card">

    <div class="lang-container">
      <button id="langAr" class="lang-btn active">🇸🇦 العربية</button>
      <button id="langEn" class="lang-btn">🇬🇧 English</button>
    </div>

    <h2 id="titleTxt" style="margin: 5px 0;">🏎️ النجاة من التصادم</h2>

    <div class="money-badge" id="startMoneyTxt">
      💰 النقود: $0
    </div>

    <!-- متجر الطرق -->
    <div class="road-shop-box" id="roadShopBox">
      <p id="selectRoadTxt" style="margin: 0 0 5px 0; font-size: 13px; color: #f39c12; font-weight: bold;">
        🛤️ اختر الطريق:
      </p>
      <div class="road-card">
        <button id="roadBtn" class="menu-btn" style="width: 85%; background: linear-gradient(45deg, #d35400, #e67e22); font-size: 14px;">
          🛣️ الطريق الحالي
        </button>
      </div>
      <div id="swipeHintTxt" class="swipe-hint">👈 اسحب للشمال للتغيير</div>
    </div>

    <p id="selectCarTxt" style="margin: 5px 0; font-size: 13px; color: #aaa;">
      اختر أو اشترِ سيارتك:
    </p>

    <div class="car-shop">
      <button id="car2Btn" class="car-btn"></button>
      <button id="car32Btn" class="car-btn"></button>
      <button id="carExtraBtn" class="car-btn"></button>
      <button id="car50Btn" class="car-btn"></button>
    </div>

    <button id="easyBtn" class="menu-btn" style="border: 2px solid gold;">
      😎 هجوم عادي
    </button>

    <button id="hardBtn" class="menu-btn">
      🔥 هجوم شرس
    </button>

    <br>

    <button id="startBtn" class="menu-btn"
      style="width: 80%; margin-top: 8px; font-size: 17px;">
      ▶ بدء اللعب
    </button>

  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="controlPanel" class="overlay-card" style="display: none;">
    <button id="pauseBtn" class="menu-btn" style="width: 100%;">
      ⏸ استئناف
    </button>

    <button id="restartBtn" class="menu-btn" style="width: 100%;">
      🔄 إعادة التشغيل
    </button>
  </div>

  <script>

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");
    const controlPanel = document.getElementById("controlPanel");
    const restartBtn = document.getElementById("restartBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const startMoneyTxt = document.getElementById("startMoneyTxt");
    const roadShopBox = document.getElementById("roadShopBox");
    const roadBtn = document.getElementById("roadBtn");
    const swipeHintTxt = document.getElementById("swipeHintTxt");

    const easyBtn = document.getElementById("easyBtn");
    const hardBtn = document.getElementById("hardBtn");
    const langAr = document.getElementById("langAr");
    const langEn = document.getElementById("langEn");

    let currentLang = "ar";

    let highScore =
      parseInt(localStorage.getItem("carRace_highScore")) || 0;

    let money =
      parseInt(localStorage.getItem("carRace_money")) || 0;

    let unlockedCars =
      JSON.parse(localStorage.getItem("carRace_unlockedCars")) ||
      ["car2"];

    let currentCar =
      localStorage.getItem("carRace_currentCar") || "car2";

    let unlockedRoads =
      JSON.parse(localStorage.getItem("carRace_unlockedRoads")) ||
      ["road"];

    let currentRoad =
      localStorage.getItem("carRace_currentRoad") || "road";

    let currentRoadIndex = 0;


    /* =========================
       صور السيارات والطريق
    ========================= */

    const carImg = new Image();
    carImg.src = "car2.png";

    const car32Img = new Image();
    car32Img.src = "car32.png";

    const carExtraImg = new Image();
    carExtraImg.src = "carExtra.png";

    const car50Img = new Image();
    car50Img.src = "car50.png";

    // صور الطرق
    const roadImg = new Image();
    roadImg.src = "road.png";

    const desertImg = new Image();
    desertImg.src = "Desert.png";

    const snowImg = new Image();
    snowImg.src = "snow.png";


    const allCars = [
      {
        id: "car2",
        img: carImg,
        color: "#e74c3c",
        price: 0,
        nameAr: "🔴 الحمراء",
        nameEn: "🔴 Red"
      },
      {
        id: "car32",
        img: car32Img,
        color: "#3498db",
        price: 100,
        nameAr: "🔵 الزرقاء",
        nameEn: "🔵 Blue"
      },
      {
        id: "carExtra",
        img: carExtraImg,
        color: "#2ecc71",
        price: 250,
        nameAr: "🟢 الخضراء",
        nameEn: "🟢 Green"
      },
      {
        id: "car50",
        img: car50Img,
        color: "#34495e",
        price: 500,
        nameAr: "⬛ السوداء",
        nameEn: "⬛ Black"
      }
    ];

    const allRoads = [
      {
        id: "road",
        img: roadImg,
        price: 0,
        nameAr: "🛣️ الطريق العادي",
        nameEn: "🛣️ Default Road"
      },
      {
        id: "desert",
        img: desertImg,
        price: 1000,
        nameAr: "🌵 الطريق الصحراوي",
        nameEn: "🌵 Desert Track"
      },
      {
        id: "snow",
        img: snowImg,
        price: 2000,
        nameAr: "❄️ الطريق الثلجي",
        nameEn: "❄️ Snow Track"
      }
    ];

    currentRoadIndex = allRoads.findIndex(r => r.id === currentRoad);
    if (currentRoadIndex === -1) currentRoadIndex = 0;


    /* =========================
       اللغات
    ========================= */

    const i18n = {
      ar: {
        title: "🏎️ النجاة من التصادم",
        easy: "😎 هجوم عادي",
        hard: "🔥 هجوم شرس",
        start: "▶ بدء اللعب",
        resume: "⏸ استئناف",
        restart: "🔄 إعادة التشغيل",
        selectCar: "اختر أو اشترِ سيارتك:",
        selectRoad: "🛤️ اختر الطريق:",
        swipeHint: "👈 اسحب للشمال لتغيير الطريق",
        money: "💰 النقود: $",
        score: "النقاط: ",
        highScore: "أعلى نتيجة: ",
        level: "المستوى: ",
        gameOver: "💥 لقد اصطدمت!\nالنقاط: ",
        driving: "مختارة",
        drive: "قيادة",
        buy: "شراء",
        activeRoad: "مختار",
        selectRoadBtn: "اختيار",
        buyRoadBtn: "شراء"
      },
      en: {
        title: "🏎️ Survive the Collision",
        easy: "😎 Normal Attack",
        hard: "🔥 Aggressive",
        start: "▶ Start Game",
        resume: "⏸ Resume",
        restart: "🔄 Restart",
        selectCar: "Choose or Buy Your Car:",
        selectRoad: "🛤️ Choose Track:",
        swipeHint: "👉 Swipe Right to change track",
        money: "💰 Cash: $",
        score: "Score: ",
        highScore: "High Score: ",
        level: "Level: ",
        gameOver: "💥 You Crashed!\nScore: ",
        driving: "Active",
        drive: "Select",
        buy: "Buy",
        activeRoad: "Active",
        selectRoadBtn: "Select",
        buyRoadBtn: "Buy"
      }
    };


    /* =========================
       تحديث أزرار واختيار الطرق
    ========================= */

    function updateRoadUI() {
      const t = i18n[currentLang];
      const road = allRoads[currentRoadIndex];
      const isUnlocked = unlockedRoads.includes(road.id);
      const isSelected = currentRoad === road.id;

      const roadName = currentLang === "ar" ? road.nameAr : road.nameEn;

      if (isSelected) {
        roadBtn.innerText = `${roadName} (✔ ${t.activeRoad})`;
        roadBtn.style.background = "linear-gradient(45deg, #27ae60, #2ecc71)";
      } else if (isUnlocked) {
        roadBtn.innerText = `${roadName} (${t.selectRoadBtn})`;
        roadBtn.style.background = "linear-gradient(45deg, #2980b9, #3498db)";
      } else {
        roadBtn.innerText = `${roadName} 🔒 $${road.price}`;
        roadBtn.style.background = "linear-gradient(45deg, #e67e22, #d35400)";
      }
    }

    function handleRoadClick() {
      const road = allRoads[currentRoadIndex];
      const isUnlocked = unlockedRoads.includes(road.id);

      if (isUnlocked) {
        currentRoad = road.id;
        localStorage.setItem("carRace_currentRoad", currentRoad);
      } else {
        if (money >= road.price) {
          money -= road.price;
          unlockedRoads.push(road.id);
          currentRoad = road.id;

          localStorage.setItem("carRace_money", money);
          localStorage.setItem("carRace_unlockedRoads", JSON.stringify(unlockedRoads));
          localStorage.setItem("carRace_currentRoad", currentRoad);
        } else {
          alert(
            currentLang === "ar"
              ? `تحتاج إلى $${road.price - money} إضافية لشراء هذا الطريق!`
              : `You need $${road.price - money} more cash!`
          );
        }
      }
      updateCarButtons();
      updateRoadUI();
    }

    roadBtn.onclick = handleRoadClick;

    // التنقل بين الطرق بالسحب (Swipe)
    let touchStartX = 0;

    roadShopBox.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    roadShopBox.addEventListener("touchend", (e) => {
      let touchEndX = e.changedTouches[0].clientX;
      let diffX = touchEndX - touchStartX;

      if (Math.abs(diffX) > 30) {
        // إذا اللغة عربية: السحب للشمال (diffX < 0) ينتقل للطريق التالي
        // إذا اللغة إنكليزية: السحب لليمين (diffX > 0) ينتقل للطريق التالي
        if (currentLang === "ar") {
          if (diffX < 0) {
            currentRoadIndex = (currentRoadIndex + 1) % allRoads.length;
          } else {
            currentRoadIndex = (currentRoadIndex - 1 + allRoads.length) % allRoads.length;
          }
        } else {
          if (diffX > 0) {
            currentRoadIndex = (currentRoadIndex + 1) % allRoads.length;
          } else {
            currentRoadIndex = (currentRoadIndex - 1 + allRoads.length) % allRoads.length;
          }
        }
        updateRoadUI();
      }
    });


    /* =========================
       أزرار السيارات
    ========================= */

    function updateCarButtons() {
      const t = i18n[currentLang];
      startMoneyTxt.innerText = `${t.money}${money}`;

      allCars.forEach(car => {
        const btn = document.getElementById(car.id + "Btn");
        if (!btn) return;

        const isUnlocked = unlockedCars.includes(car.id);
        const isSelected = currentCar === car.id;
        const carName = currentLang === "ar" ? car.nameAr : car.nameEn;

        if (isSelected) {
          btn.innerText = `${carName}\n(✔ ${t.driving})`;
          btn.style.background = "linear-gradient(45deg, #27ae60, #2ecc71)";
        } else if (isUnlocked) {
          btn.innerText = `${carName}\n(${t.drive})`;
          btn.style.background = "linear-gradient(45deg, #2980b9, #3498db)";
        } else {
          btn.innerText = `${carName}\n🔒 $${car.price}`;
          btn.style.background = "linear-gradient(45deg, #7f8c8d, #95a5a6)";
        }
      });
    }

    function handleCarClick(carId) {
      const car = allCars.find(c => c.id === carId);
      if (!car) return;

      if (unlockedCars.includes(carId)) {
        currentCar = carId;
        localStorage.setItem("carRace_currentCar", currentCar);
      } else {
        if (money >= car.price) {
          money -= car.price;
          unlockedCars.push(carId);
          currentCar = carId;

          localStorage.setItem("carRace_money", money);
          localStorage.setItem("carRace_unlockedCars", JSON.stringify(unlockedCars));
          localStorage.setItem("carRace_currentCar", currentCar);
        } else {
          alert(
            currentLang === "ar"
              ? `تحتاج إلى $${car.price - money} إضافية لشراء هذه السيارة!`
              : `You need $${car.price - money} more cash!`
          );
        }
      }
      updateCarButtons();
    }

    allCars.forEach(car => {
      document.getElementById(car.id + "Btn").onclick = () => handleCarClick(car.id);
    });


    /* =========================
       تغيير اللغة
    ========================= */

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

      langAr.classList.toggle("active", lang === "ar");
      langEn.classList.toggle("active", lang === "en");

      const t = i18n[lang];

      document.getElementById("titleTxt").innerText = t.title;
      document.getElementById("selectCarTxt").innerText = t.selectCar;
      document.getElementById("selectRoadTxt").innerText = t.selectRoad;
      swipeHintTxt.innerText = t.swipeHint;

      easyBtn.innerText = t.easy;
      hardBtn.innerText = t.hard;
      startBtn.innerText = t.start;
      pauseBtn.innerText = t.resume;
      restartBtn.innerText = t.restart;

      updateCarButtons();
      updateRoadUI();
    }

    langAr.onclick = () => setLanguage("ar");
    langEn.onclick = () => setLanguage("en");


    /* =========================
       إعداد اللعبة
    ========================= */

    let difficulty = "easy";
    let paused = false;
    let gameOver = false;
    let roadY = 0;
    let coins = [];
    let attackerCars = [];
    let sparks = [];

    const carWidth = 52;
    const carHeight = 105;

    easyBtn.onclick = () => {
      difficulty = "easy";
      easyBtn.style.border = "2px solid gold";
      hardBtn.style.border = "none";
    };

    hardBtn.onclick = () => {
      difficulty = "hard";
      hardBtn.style.border = "2px solid gold";
      easyBtn.style.border = "none";
    };


    /* =========================
       حجم الشاشة
    ========================= */

    function resizeCanvas() {
      canvas.width = Math.min(window.innerWidth, 480);
      canvas.height = window.innerHeight;
    }

    window.onresize = resizeCanvas;
    resizeCanvas();


    /* =========================
       الأصوات
    ========================= */

    const bgMusic = new Audio("background.mp3");
    bgMusic.loop = true;

    const crashSound = new Audio("explosion.mp3");

    let playerX;
    let playerY;
    let playerVx = 0;
    let score;
    let level;
    let dodgedCars;


    /* =========================
       سيارة احتياطية
    ========================= */

    function drawFallbackCar(w, h, color, isPlayer) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(-w / 2, -h / 2, w, h, 8);
      ctx.fill();

      ctx.fillStyle = "#87CEEB";
      const glassY = isPlayer ? -h / 4 : h / 10;
      ctx.fillRect(-w / 2 + 4, glassY, w - 8, h / 4);

      ctx.fillStyle = "#111";
      ctx.fillRect(-w / 2 - 3, -h / 3, 4, 18);
      ctx.fillRect(w / 2 - 1, -h / 3, 4, 18);
      ctx.fillRect(-w / 2 - 3, h / 4, 4, 18);
      ctx.fillRect(w / 2 - 1, h / 4, 4, 18);
    }


    /* =========================
       رسم السيارة
    ========================= */

    function renderCarVehicle(img, x, y, w, h, color, isPlayer, tilt = 0) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);

      let rotationAngle = isPlayer ? 0 : Math.PI;
      rotationAngle += tilt * 0.03;

      ctx.rotate(rotationAngle);

      if (img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
      } else {
        drawFallbackCar(w, h, color, isPlayer);
      }

      ctx.restore();
    }


    /* =========================
       Hitbox
    ========================= */

    function getSolidBodyHitbox(x, y, w, h) {
      const insetX = w * 0.22;
      const insetY = h * 0.12;

      return {
        x: x + insetX,
        y: y + insetY,
        w: w - (insetX * 2),
        h: h - (insetY * 2)
      };
    }

    function checkSolidTouch(rectA, rectB) {
      return (
        rectA.x < rectB.x + rectB.w &&
        rectA.x + rectA.w > rectB.x &&
        rectA.y < rectB.y + rectB.h &&
        rectA.y + rectA.h > rectB.y
      );
    }


    /* =========================
       Smart AI
    ========================= */

    class SmartAICar {
      constructor(carModel) {
        this.model = carModel;
        this.w = carWidth;
        this.h = carHeight;
        this.reset();
      }

      reset() {
        this.x = Math.random() * (canvas.width - this.w);
        this.y = -this.h - Math.random() * 350;
        this.baseSpeed = (difficulty === "easy" ? 3.5 : 5.2) + Math.random() * 1.5;
        this.steeringPower = difficulty === "easy" ? 0.025 : 0.05;
        this.vx = 0;
      }

      update(targetX, targetY) {
        let distanceY = targetY - this.y;

        if (distanceY > 0 && distanceY < canvas.height * 0.75) {
          let diffX = targetX - this.x;
          this.vx += (diffX * this.steeringPower - this.vx) * 0.1;
        } else {
          this.vx *= 0.9;
        }

        this.x += this.vx;
        this.y += this.baseSpeed + (level * 0.4);

        this.x = Math.max(5, Math.min(canvas.width - this.w - 5, this.x));

        if (this.y > canvas.height + 60) {
          this.reset();
          score += 1;
          dodgedCars += 1;
          level = Math.floor(dodgedCars / 7) + 1;
        }
      }
    }


    /* =========================
       إنشاء المنافسين
    ========================= */

    function setupAttackers() {
      attackerCars = [];
      const opponents = allCars.filter(c => c.id !== currentCar);
      const count = difficulty === "easy" ? 2 : 3;

      for (let i = 0; i < count; i++) {
        attackerCars.push(
          new SmartAICar(opponents[i % opponents.length])
        );
      }
    }


    /* =========================
       العملات
    ========================= */

    function spawnCoin() {
      if (Math.random() < 0.02 && coins.length < 3) {
        coins.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: -40,
          value: 10,
          size: 24
        });
      }
    }


    /* =========================
       شرارات التصادم
    ========================= */

    function createCrashSparks(x, y) {
      for (let i = 0; i < 35; i++) {
        sparks.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.5) * 16,
          size: Math.random() * 5 + 2,
          life: 1
        });
      }
    }


    /* =========================
       إعادة اللعبة
    ========================= */

    function resetGame() {
      resizeCanvas();

      playerX = canvas.width / 2 - carWidth / 2;
      playerY = canvas.height - carHeight - 30;
      playerVx = 0;

      roadY = 0;
      score = 0;
      dodgedCars = 0;
      level = 1;
      coins = [];
      sparks = [];
      gameOver = false;
      paused = false;

      controlPanel.style.display = "none";
      setupAttackers();
    }


    /* =========================
       رسم اللعبة
    ========================= */

    function drawGame() {
      if (gameOver || paused) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let roadSpeed = (difficulty === "easy" ? 6 : 8) + level;
      roadY = (roadY + roadSpeed) % canvas.height;

      /* الطريق المحدد */
      const activeRoadObj = allRoads.find(r => r.id === currentRoad) || allRoads[0];
      const activeRoadImg = activeRoadObj.img;

      if (activeRoadImg.complete && activeRoadImg.naturalWidth !== 0) {
        ctx.drawImage(activeRoadImg, 0, roadY, canvas.width, canvas.height);
        ctx.drawImage(activeRoadImg, 0, roadY - canvas.height, canvas.width, canvas.height);
      } else {
        // الطريق الاحتياطي في حال عدم تحميل الصورة
        ctx.fillStyle = currentRoad === "desert" ? "#d35400" : (currentRoad === "snow" ? "#2c3e50" : "#333");
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#f1c40f";
        for (let i = -canvas.height; i < canvas.height; i += 70) {
          ctx.fillRect(canvas.width / 2 - 3, i + (roadY % 70), 6, 35);
        }
      }


      /* العملات */
      spawnCoin();

      for (let i = coins.length - 1; i >= 0; i--) {
        let c = coins[i];
        c.y += roadSpeed;

        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size / 2, 0, Math.PI * 2);
        ctx.fillStyle = "#f39c12";
        ctx.fill();

        ctx.lineWidth = 2;
        ctx.strokeStyle = "#fff";
        ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.font = "bold 12px Arial";
        ctx.textAlign = "center";
        ctx.fillText("$", c.x, c.y + 4);

        if (
          Math.hypot(
            (playerX + carWidth / 2) - c.x,
            (playerY + carHeight / 2) - c.y
          ) < carWidth / 2 + c.size / 2
        ) {
          money += c.value;
          score += 5;
          localStorage.setItem("carRace_money", money);
          coins.splice(i, 1);
        } else if (c.y > canvas.height + 20) {
          coins.splice(i, 1);
        }
      }


      /* سيارة اللاعب */
      const playerModel = allCars.find(c => c.id === currentCar);

      renderCarVehicle(
        playerModel.img,
        playerX,
        playerY,
        carWidth,
        carHeight,
        playerModel.color,
        true,
        playerVx
      );

      const playerSolidBox = getSolidBodyHitbox(playerX, playerY, carWidth, carHeight);


      /* المنافسون */
      for (let attacker of attackerCars) {
        attacker.update(playerX, playerY);

        renderCarVehicle(
          attacker.model.img,
          attacker.x,
          attacker.y,
          attacker.w,
          attacker.h,
          attacker.model.color,
          false,
          attacker.vx
        );

        const attackerSolidBox = getSolidBodyHitbox(attacker.x, attacker.y, attacker.w, attacker.h);

        if (checkSolidTouch(playerSolidBox, attackerSolidBox)) {
          const impactX = (playerSolidBox.x + attackerSolidBox.x + playerSolidBox.w) / 2;
          const impactY = (playerSolidBox.y + attackerSolidBox.y) / 2;

          createCrashSparks(impactX, impactY);
          endGame();
        }
      }


      /* الشرارات */
      for (let i = sparks.length - 1; i >= 0; i--) {
        let s = sparks[i];

        ctx.fillStyle = `rgba(255, ${Math.floor(s.life * 255)}, 0, ${s.life})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();

        s.x += s.vx;
        s.y += s.vy;
        s.life -= 0.05;

        if (s.life <= 0) {
          sparks.splice(i, 1);
        }
      }


      /* المعلومات */
      const t = i18n[currentLang];

      ctx.fillStyle = "white";
      ctx.font = "bold 15px Arial";

      if (currentLang === "ar") {
        ctx.textAlign = "right";
        ctx.fillText(`${t.money}${money}`, canvas.width - 15, 30);
        ctx.fillText(`${t.score} ${score}`, canvas.width - 15, 55);
        ctx.fillText(`${t.highScore} ${highScore}`, canvas.width - 15, 80);
        ctx.fillText(`${t.level} ${level}`, canvas.width - 15, 105);
      } else {
        ctx.textAlign = "left";
        ctx.fillText(`${t.money}${money}`, 15, 30);
        ctx.fillText(`${t.score} ${score}`, 15, 55);
        ctx.fillText(`${t.highScore} ${highScore}`, 15, 80);
        ctx.fillText(`${t.level} ${level}`, 15, 105);
      }

      requestAnimationFrame(drawGame);
    }


    /* =========================
       نهاية اللعبة
    ========================= */

    function endGame() {
      gameOver = true;
      bgMusic.pause();

      try {
        crashSound.play();
      } catch(e) {}

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("carRace_highScore", highScore);
      }

      setTimeout(() => {
        const t = i18n[currentLang];

        alert(
          t.gameOver +
          score +
          "\n" +
          t.money +
          money +
          "\n" +
          t.highScore +
          highScore
        );

        startScreen.style.display = "block";
        canvas.style.display = "none";

        updateCarButtons();
        updateRoadUI();
      }, 100);
    }


    /* =========================
       لوحة المفاتيح
    ========================= */

    document.onkeydown = (e) => {
      if (gameOver || paused) return;

      let step = 22;

      if (e.key === "ArrowLeft" && playerX > 0) {
        playerX -= step;
        playerVx = -5;
      }
      if (e.key === "ArrowRight" && playerX < canvas.width - carWidth) {
        playerX += step;
        playerVx = 5;
      }
      if (e.key === "ArrowUp" && playerY > 0) {
        playerY -= step;
      }
      if (e.key === "ArrowDown" && playerY < canvas.height - carHeight) {
        playerY += step;
      }
    };

    document.onkeyup = () => {
      playerVx = 0;
    };


    /* =========================
       التحكم باللمس للسيارة
    ========================= */

    function handleTouch(e) {
      if (gameOver || paused) return;

      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();

      let targetX = (touch.clientX - rect.left) - carWidth / 2;
      playerVx = targetX - playerX;

      playerX = Math.max(0, Math.min(canvas.width - carWidth, targetX));
      playerY = Math.max(0, Math.min(canvas.height - carHeight, (touch.clientY - rect.top) - carHeight / 2));
    }

    canvas.addEventListener("touchmove", (e) => {
      handleTouch(e);
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener("touchstart", (e) => handleTouch(e), { passive: true });
    canvas.addEventListener("touchend", () => { playerVx = 0; });


    /* =========================
       إيقاف / استئناف
    ========================= */

    function togglePause() {
      if (gameOver) return;

      paused = !paused;

      if (paused) {
        bgMusic.pause();
        controlPanel.style.display = "block";
      } else {
        try { bgMusic.play(); } catch(e) {}
        controlPanel.style.display = "none";
        drawGame();
      }
    }

    pauseBtn.onclick = togglePause;

    restartBtn.onclick = () => {
      resetGame();
      try { bgMusic.play(); } catch(e) {}
      drawGame();
    };

    startBtn.onclick = () => {
      startScreen.style.display = "none";
      canvas.style.display = "block";

      resetGame();
      try { bgMusic.play(); } catch(e) {}
      drawGame();
    };


    /* =========================
       تشغيل اللغة العربية
    ========================= */

    setLanguage("ar");

  </script>

</body>
