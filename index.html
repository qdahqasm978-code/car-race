<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏎️ Oncoming Attack Car Race</title>
  <style>
    body { background-color: #0d0d0d; margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
    canvas { display: none; background-color: #222; margin: 0 auto; display: block; }
    
    #startScreen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; width: 90%; max-width: 400px; z-index: 30; background: rgba(15,15,15,0.92); padding: 25px; border-radius: 15px; border: 2px solid #e74c3c; box-shadow: 0 0 25px rgba(231,76,60,0.4); }
    .lang-container { margin-bottom: 15px; display: flex; justify-content: center; gap: 10px; }
    .lang-btn { padding: 8px 16px; font-size: 14px; background: #222; color: white; border: 1px solid #555; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background: #e74c3c; border-color: gold; font-weight: bold; }

    button { margin: 6px; padding: 12px 20px; font-size: 16px; background: linear-gradient(45deg, #e74c3c, #c0392b); color: white; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.2s; }
    button:active { transform: scale(0.95); }
    
    #controlPanel { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.95); padding: 20px; border-radius: 15px; border: 1px solid #444; box-shadow: 0 0 20px rgba(231,76,60,0.5); z-index: 20; min-width: 260px; }
    #controlPanel button { display: block; margin: 8px auto; width: 100%; }
  </style>
</head>
<body>

  <div id="startScreen">
    <div class="lang-container">
      <button id="langAr" class="lang-btn active">🇸🇦 العربية</button>
      <button id="langEn" class="lang-btn">🇬🇧 English</button>
    </div>

    <h1 id="titleTxt">🏎️ سباق هجوم السيارات</h1>
    <p id="subTitleTxt">احذر! السيارات المعاكسة تهاجم سيارتك ومهمتك جمع النقود والمراوغة</p>
    <button id="easyBtn" style="border: 2px solid gold;">😎 هجوم عادي</button>
    <button id="hardBtn">🔥 هجوم شرس</button>
    <br><br>
    <button id="startBtn">▶ بدء اللعب</button>
  </div>

  <canvas id="gameCanvas"></canvas>
  
  <div id="controlPanel">
    <button id="pauseBtn">⏸ استئناف</button>
    <button id="restartBtn">🔄 إعادة التشغيل</button>
    <hr style="border-color: #444; margin: 10px 0;">
    <p id="selectCarTxt" style="color: white; margin: 5px 0;">اختر سيارتك:</p>
    <button id="car2Btn">🔴 الحمراء</button>
    <button id="car32Btn">🔵 الزرقاء</button>
    <button id="carExtraBtn">🟢 الخضراء</button>
    <button id="car50Btn">⬛ السوداء</button>
  </div>
  
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");
    const controlPanel = document.getElementById("controlPanel");
    const restartBtn = document.getElementById("restartBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    
    const easyBtn = document.getElementById("easyBtn");
    const hardBtn = document.getElementById("hardBtn");

    const car2Btn = document.getElementById("car2Btn");
    const car32Btn = document.getElementById("car32Btn");
    const carExtraBtn = document.getElementById("carExtraBtn");
    const car50Btn = document.getElementById("car50Btn");

    const langAr = document.getElementById("langAr");
    const langEn = document.getElementById("langEn");

    let currentLang = "ar";
    let highScore = parseInt(localStorage.getItem("carRace_highScore")) || 0;
    let money = parseInt(localStorage.getItem("carRace_money")) || 0;

    const i18n = {
      ar: {
        title: "🏎️ سباق هجوم السيارات",
        subtitle: "السيارات المعاكسة تهاجمك مباشرة! اجمع النقود وتفادَ التصادم",
        easy: "😎 هجوم عادي", hard: "🔥 هجوم شرس", start: "▶ بدء اللعب",
        resume: "⏸ استئناف", restart: "🔄 إعادة التشغيل",
        selectCar: "اختر سيارتك:", carRed: "🔴 الحمراء", carBlue: "🔵 الزرقاء", carGreen: "🟢 الخضراء", carBlack: "⬛ السوداء",
        score: "النقاط: ", highScore: "أعلى نتيجة: ", money: "💰 النقود: $", level: "المستوى: ", gameOver: "💥 انتهت اللعبة!\nالنقاط: "
      },
      en: {
        title: "🏎️ Oncoming Attack Race",
        subtitle: "Oncoming traffic is attacking you! Collect cash and dodge!",
        easy: "😎 Normal Attack", hard: "🔥 Aggressive Attack", start: "▶ Start Game",
        resume: "⏸ Resume", restart: "🔄 Restart",
        selectCar: "Choose Your Car:", carRed: "🔴 Red", carBlue: "🔵 Blue", carGreen: "🟢 Green", carBlack: "⬛ Black",
        score: "Score: ", highScore: "High Score: ", money: "💰 Cash: $", level: "Level: ", gameOver: "💥 Game Over!\nScore: "
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      langAr.classList.toggle("active", lang === "ar");
      langEn.classList.toggle("active", lang === "en");
      const t = i18n[lang];
      document.getElementById("titleTxt").innerText = t.title;
      document.getElementById("subTitleTxt").innerText = t.subtitle;
      easyBtn.innerText = t.easy; hardBtn.innerText = t.hard; startBtn.innerText = t.start;
      pauseBtn.innerText = t.resume; restartBtn.innerText = t.restart;
      document.getElementById("selectCarTxt").innerText = t.selectCar;
      car2Btn.innerText = t.carRed; car32Btn.innerText = t.carBlue; carExtraBtn.innerText = t.carGreen; car50Btn.innerText = t.carBlack;
    }

    langAr.onclick = () => setLanguage("ar");
    langEn.onclick = () => setLanguage("en");

    let difficulty = "easy"; 
    let paused = false, gameOver = false, currentCar = "car2", roadY = 0;
    let particles = [], coins = [], attackerCars = [];

    const carWidth = 55;
    const carHeight = 110;

    easyBtn.onclick = () => { difficulty = "easy"; easyBtn.style.border = "2px solid gold"; hardBtn.style.border = "none"; };
    hardBtn.onclick = () => { difficulty = "hard"; hardBtn.style.border = "2px solid gold"; easyBtn.style.border = "none"; };

    car2Btn.onclick = () => { currentCar = "car2"; togglePause(); };
    car32Btn.onclick = () => { currentCar = "car32"; togglePause(); };
    carExtraBtn.onclick = () => { currentCar = "carExtra"; togglePause(); };
    car50Btn.onclick = () => { currentCar = "car50"; togglePause(); };

    function resizeCanvas() { 
      canvas.width = Math.min(window.innerWidth, 480); 
      canvas.height = window.innerHeight;
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    const carImg = new Image(); carImg.src = "car2.png";
    const roadImg = new Image(); roadImg.src = "road.png";
    const car32Img = new Image(); car32Img.src = "car32.png";
    const carExtraImg = new Image(); carExtraImg.src = "carExtra.png";
    const car50Img = new Image(); car50Img.src = "car50.png";

    const allCars = [
      { id: "car2", img: carImg, color: "#e74c3c" },
      { id: "car32", img: car32Img, color: "#3498db" },
      { id: "carExtra", img: carExtraImg, color: "#2ecc71" },
      { id: "car50", img: car50Img, color: "#34495e" }
    ];

    const bgMusic = new Audio("background.mp3"); bgMusic.loop = true;
    const crashSound = new Audio("explosion.mp3");

    let playerX, playerY, playerVx = 0, score, level, dodgedCars;

    function drawFallbackCar(w, h, color, isPlayer) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(-w / 2, -h / 2, w, h, 8);
      ctx.fill();

      ctx.fillStyle = "#87CEEB";
      const glassY = isPlayer ? -h / 4 : h / 10;
      ctx.fillRect(-w / 2 + 4, glassY, w - 8, h / 4);

      ctx.fillStyle = "#111";
      ctx.fillRect(-w / 2 - 3, -h / 3, 4, 18);
      ctx.fillRect(w / 2 - 1, -h / 3, 4, 18);
      ctx.fillRect(-w / 2 - 3, h / 4, 4, 18);
      ctx.fillRect(w / 2 - 1, h / 4, 4, 18);
    }

    // رسم السيارة واتجاهها المعاكس بشكل صحيح
    function renderCarVehicle(img, x, y, w, h, color, isPlayer, tilt = 0) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);

      // سيارة اللاعب للأعلى (0)، والسيارات المعاكسة متجهة للأسفل نحو اللاعب (180 درجة)
      let rotationAngle = isPlayer ? 0 : Math.PI;
      rotationAngle += (tilt * 0.04); 

      ctx.rotate(rotationAngle);

      if (img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
      } else {
        drawFallbackCar(w, h, color, isPlayer);
      }

      ctx.restore();
    }

    // كلاس الذكاء الاصطناعي الخاص بالمهاجمة
    class AttackerVehicle {
      constructor(carModel) {
        this.model = carModel;
        this.w = carWidth;
        this.h = carHeight;
        this.reset();
      }

      reset() {
        this.x = Math.random() * (canvas.width - this.w);
        this.y = -this.h - Math.random() * 300;
        this.speed = (difficulty === "easy" ? 3.5 : 5) + Math.random() * 2;
        this.attackAgility = difficulty === "easy" ? 0.025 : 0.055;
        this.vx = 0;
      }

      update(targetPlayerX) {
        // ملاحقة ومهاجمة سيارة اللاعب في اتجاه X
        let diffX = targetPlayerX - this.x;
        this.vx = diffX * this.attackAgility;
        this.x += this.vx;

        // الحركة للأسفل باتجاه اللاعب
        this.y += this.speed + (level * 0.5);

        // عند اجتياز الشاشة
        if (this.y > canvas.height + 50) {
          this.reset();
          score += 1;
          dodgedCars += 1;
          level = Math.floor(dodgedCars / 7) + 1;
        }
      }
    }

    function setupAttackers() {
      attackerCars = [];
      const opponents = allCars.filter(c => c.id !== currentCar);
      const count = difficulty === "easy" ? 2 : 3;

      for (let i = 0; i < count; i++) {
        attackerCars.push(new AttackerVehicle(opponents[i % opponents.length]));
      }
    }

    function spawnCoin() {
      if (Math.random() < 0.02 && coins.length < 3) {
        coins.push({ 
          x: Math.random() * (canvas.width - 40) + 20, 
          y: -40, 
          value: 10,
          size: 24 
        });
      }
    }

    function resetGame() {
      resizeCanvas();
      playerX = canvas.width / 2 - carWidth / 2;
      playerY = canvas.height - carHeight - 30; 
      playerVx = 0;
      roadY = 0;
      score = 0; 
      dodgedCars = 0; 
      level = 1; 
      particles = []; 
      coins = [];
      gameOver = false; 
      paused = false;
      controlPanel.style.display = "none";
      setupAttackers();
    }

    // خوارزمية فحص التصادم المتناسبة
    function checkHitbox(ax, ay, aw, ah, bx, by, bw, bh) {
      const padX = aw * 0.15;
      const padY = ah * 0.10;
      return (
        ax + padX < bx + bw - padX &&
        ax + aw - padX > bx + padX &&
        ay + padY < by + bh - padY &&
        ay + ah - padY > by + padY
      );
    }

    function drawGame() {
      if (gameOver || paused) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let roadSpeed = (difficulty === "easy" ? 6 : 8) + level;
      roadY = (roadY + roadSpeed) % canvas.height;

      // رسم الطريق المتصل ومسار road.png
      if (roadImg.complete && roadImg.naturalWidth !== 0) {
        ctx.drawImage(roadImg, 0, roadY, canvas.width, canvas.height);
        ctx.drawImage(roadImg, 0, roadY - canvas.height, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#333"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f1c40f";
        for (let i = -canvas.height; i < canvas.height; i += 70) {
          ctx.fillRect(canvas.width / 2 - 3, i + (roadY % 70), 6, 35);
        }
      }

      // رسم النقود وجمعها
      spawnCoin();
      for (let i = coins.length - 1; i >= 0; i--) {
        let c = coins[i];
        c.y += roadSpeed;

        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size / 2, 0, Math.PI * 2);
        ctx.fillStyle = "#f39c12"; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.font = "bold 12px Arial"; ctx.textAlign = "center";
        ctx.fillText("$", c.x, c.y + 4);

        // عند التقاط النقود
        if (Math.hypot((playerX + carWidth / 2) - c.x, (playerY + carHeight / 2) - c.y) < carWidth / 2 + c.size / 2) {
          money += c.value;
          score += 5;
          localStorage.setItem("carRace_money", money);
          coins.splice(i, 1);
        } else if (c.y > canvas.height + 20) {
          coins.splice(i, 1);
        }
      }

      // رسم سيارة اللاعب (متجهة للأعلى)
      const playerModel = allCars.find(c => c.id === currentCar);
      renderCarVehicle(playerModel.img, playerX, playerY, carWidth, carHeight, playerModel.color, true, playerVx);

      // تحديث ورسم السيارات المهاجمة (معاكسة ومتجهة للأسفل)
      for (let attacker of attackerCars) {
        attacker.update(playerX);
        renderCarVehicle(attacker.model.img, attacker.x, attacker.y, attacker.w, attacker.h, attacker.model.color, false, attacker.vx);

        // فحص تصادم الهجوم
        if (checkHitbox(playerX, playerY, carWidth, carHeight, attacker.x, attacker.y, attacker.w, attacker.h)) {
          endGame();
        }
      }

      // طباعة العدادات وكمية النقود
      const t = i18n[currentLang];
      ctx.fillStyle = "white"; ctx.font = "bold 15px Arial";
      if (currentLang === "ar") {
        ctx.textAlign = "right";
        ctx.fillText(`${t.money}${money}`, canvas.width - 15, 30);
        ctx.fillText(`${t.score} ${score}`, canvas.width - 15, 55);
        ctx.fillText(`${t.highScore} ${highScore}`, canvas.width - 15, 80);
        ctx.fillText(`${t.level} ${level}`, canvas.width - 15, 105);
      } else {
        ctx.textAlign = "left";
        ctx.fillText(`${t.money}${money}`, 15, 30);
        ctx.fillText(`${t.score} ${score}`, 15, 55);
        ctx.fillText(`${t.highScore} ${highScore}`, 15, 80);
        ctx.fillText(`${t.level} ${level}`, 15, 105);
      }

      requestAnimationFrame(drawGame);
    }

    function endGame() {
      gameOver = true;
      bgMusic.pause();
      try { crashSound.play(); } catch(e){}

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("carRace_highScore", highScore);
      }

      setTimeout(() => {
        const t = i18n[currentLang];
        alert(t.gameOver + score + "\n" + t.money + money + "\n" + t.highScore + highScore);
        controlPanel.style.display = "block";
        pauseBtn.style.display = "none";
        restartBtn.style.display = "block";
      }, 100);
    }

    document.onkeydown = (e) => {
      if (gameOver || paused) return;
      let step = 22;
      if (e.key === "ArrowLeft" && playerX > 0) { playerX -= step; playerVx = -5; }
      if (e.key === "ArrowRight" && playerX < canvas.width - carWidth) { playerX += step; playerVx = 5; }
      if (e.key === "ArrowUp" && playerY > 0) playerY -= step;
      if (e.key === "ArrowDown" && playerY < canvas.height - carHeight) playerY += step;
    };
    document.onkeyup = () => { playerVx = 0; };

    function handleTouch(e) {
      if (gameOver || paused) return;
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      let targetX = (touch.clientX - rect.left) - carWidth / 2;
      playerVx = targetX - playerX;
      playerX = Math.max(0, Math.min(canvas.width - carWidth, targetX));
      playerY = Math.max(0, Math.min(canvas.height - carHeight, (touch.clientY - rect.top) - carHeight / 2));
    }

    canvas.addEventListener("touchmove", (e) => { handleTouch(e); e.preventDefault(); }, { passive: false });
    canvas.addEventListener("touchstart", (e) => handleTouch(e), { passive: true });
    canvas.addEventListener("touchend", () => { playerVx = 0; });

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      if (paused) {
        bgMusic.pause();
        controlPanel.style.display = "block";
        pauseBtn.style.display = "block";
        restartBtn.style.display = "block";
      } else {
        try { bgMusic.play(); } catch(e){}
        controlPanel.style.display = "none";
        drawGame();
      }
    }

    pauseBtn.onclick = togglePause;
    restartBtn.onclick = () => { resetGame(); try { bgMusic.play(); } catch(e){} drawGame(); };
    startBtn.onclick = () => { startScreen.style.display = "none"; canvas.style.display = "block"; resetGame(); try { bgMusic.play(); } catch(e){} drawGame(); };
  </script>
</body>
</html>
