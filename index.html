<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏎️ Car Race Game</title>
  <style>
    body { background-color: black; margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: none; background-color: #333; border: 2px solid white; width: 100vw; height: 100vh; }
    #startScreen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; width: 90%; }
    button { margin: 10px; padding: 14px 28px; font-size: 22px; background: linear-gradient(45deg, #ff0000, #cc0000); color: white; border: none; cursor: pointer; border-radius: 10px; transition: 0.2s; }
    button:active { transform: scale(0.95); }
    #controlPanel { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 15px; }
    #controlPanel button { display: block; margin: 10px auto; width: 150px; }
    
    /* زر الإيقاف المؤقت أثناء اللعب المخصص للموبايل */
    #ingamePauseBtn { display: none; position: absolute; top: 15px; right: 15px; padding: 10px 20px; font-size: 16px; background: rgba(255, 255, 255, 0.2); border: 1px solid white; border-radius: 8px; z-index: 10; color: white; }
  </style>
</head>
<body>

  <button id="ingamePauseBtn">⏸ Pause</button>

  <div id="startScreen">
    <h1>🏎️ Car Race Game</h1>
    <p>اختر مستوى الصعوبة ثم اضغط تشغيل</p>
    <button id="easyBtn" style="border: 2px solid gold;">😎 سهل</button>
    <button id="hardBtn">🔥 صعب</button>
    <br><br>
    <button id="startBtn">▶ Start</button>
  </div>

  <canvas id="gameCanvas"></canvas>
  
  <div id="controlPanel">
    <button id="pauseBtn">⏸ Resume</button>
    <button id="restartBtn">🔄 Restart</button>
    <hr style="border-color: #555;">
    <p style="color: white; margin: 5px 0;">اختر سيارتك:</p>
    <button id="car2Btn">🚗 Car 2</button>
    <button id="car32Btn">🚙 Car 32</button>
    <button id="carExtraBtn">🏎️ Car Extra</button>
    <button id="car50Btn">🚘 Car 50</button>
  </div>
  
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");
    const controlPanel = document.getElementById("controlPanel");
    const restartBtn = document.getElementById("restartBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const ingamePauseBtn = document.getElementById("ingamePauseBtn");
    
    const easyBtn = document.getElementById("easyBtn");
    const hardBtn = document.getElementById("hardBtn");

    const car2Btn = document.getElementById("car2Btn");
    const car32Btn = document.getElementById("car32Btn");
    const carExtraBtn = document.getElementById("carExtraBtn");
    const car50Btn = document.getElementById("car50Btn");

    let difficulty = "easy"; 
    let paused = false;
    let gameOver = false;
    let currentCar = "car2";
    let roadY = 0; 
    
    // متغير لحفظ نظام إبقاء الشاشة مضيئة
    let wakeLock = null;

    easyBtn.onclick = () => { difficulty = "easy"; easyBtn.style.border = "2px solid gold"; hardBtn.style.border = "none"; };
    hardBtn.onclick = () => { difficulty = "hard"; hardBtn.style.border = "2px solid gold"; easyBtn.style.border = "none"; };

    car2Btn.onclick = () => { currentCar = "car2"; togglePause(); };
    car32Btn.onclick = () => { currentCar = "car32"; togglePause(); };
    carExtraBtn.onclick = () => { currentCar = "carExtra"; togglePause(); };
    car50Btn.onclick = () => { currentCar = "car50"; togglePause(); };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    const carImg = new Image(); carImg.src = "car2.png";
    const roadImg = new Image(); roadImg.src = "road.png";
    const car32Img = new Image(); car32Img.src = "car32.png";
    const carExtraImg = new Image(); carExtraImg.src = "carExtra.png";
    const car50Img = new Image(); car50Img.src = "car50.png";

    const bgMusic = new Audio("background.mp3");
    bgMusic.loop = true;
    const crashSound = new Audio("explosion.mp3");

    let carX, carY, car32X, car32Y, carExtraX, carExtraY;
    let score, level;
    const carWidth = 80;
    const carHeight = 160;

    // دالة طلب إبقاء الشاشة مضيئة (Wake Lock)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log("Wake Lock لم يشتغل: ", err.message);
      }
    }

    // دالة إلغاء تفعيل إبقاء الشاشة مضيئة للحفاظ على البطارية عند الخسارة أو التوقف
    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    function resetGame() {
      resizeCanvas();
      carX = canvas.width / 2 - carWidth / 2;
      carY = canvas.height / 2 - carHeight / 2; 
      
      roadY = 0;
      car32X = Math.random() * (canvas.width - carWidth);
      car32Y = -160;
      carExtraX = Math.random() * (canvas.width - carWidth);
      carExtraY = -400;
      window.car50X = Math.random() * (canvas.width - carWidth);
      window.car50Y = -600;
      score = 0;
      level = 1;
      gameOver = false;
      paused = false;
      controlPanel.style.display = "none";
      ingamePauseBtn.style.display = "block";
    }

    function checkCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
      const padX = 8; 
      const padY = 15; 
      return (
        x1 + padX < x2 + w2 - padX &&
        x1 + w1 - padX > x2 + padX &&
        y1 + padY < y2 + h2 - padY &&
        y1 + h1 - padY > y2 + padY
      );
    }

    function drawGame() {
      if (gameOver || paused) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let scrollSpeed = (difficulty === "easy" ? 4 : 8) + level;
      roadY += scrollSpeed;
      if (roadY >= canvas.height) {
        roadY = 0;
      }

      if (roadImg.complete) {
        ctx.drawImage(roadImg, 0, roadY, canvas.width, canvas.height);
        ctx.drawImage(roadImg, 0, roadY - canvas.height, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#333";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        for (let i = -canvas.height; i < canvas.height; i += 100) {
          ctx.fillRect(canvas.width / 2 - 5, i + (roadY % 100), 10, 50);
        }
      }

      if (currentCar === "car2") {
        ctx.drawImage(carImg, carX, carY, carWidth, carHeight);
      } else if (currentCar === "car32") {
        ctx.save();
        ctx.translate(carX + carWidth/2, carY + carHeight/2);
        ctx.rotate(Math.PI);
        ctx.drawImage(car32Img, -carWidth/2, -carHeight/2, carWidth, carHeight);
        ctx.restore();
      } else if (currentCar === "carExtra") {
        ctx.save();
        ctx.translate(carX + carWidth/2, carY + carHeight/2);
        ctx.rotate(Math.PI);
        ctx.drawImage(carExtraImg, -carWidth/2, -carHeight/2, carWidth, carHeight);
        ctx.restore();
      } else if (currentCar === "car50") {
        ctx.save();
        ctx.translate(carX + carWidth/2, carY + carHeight/2);
        ctx.rotate(Math.PI);
        ctx.drawImage(car50Img, -carWidth/2, -carHeight/2, carWidth, carHeight);
        ctx.restore();
      }

      if (currentCar !== "car32") ctx.drawImage(car32Img, car32X, car32Y, carWidth, carHeight);
      if (currentCar !== "carExtra") ctx.drawImage(carExtraImg, carExtraX, carExtraY, carWidth, carHeight);

      let baseSpeed32 = (difficulty === "easy") ? 2 : 4;
      let baseSpeedExtra = (difficulty === "easy") ? 3 : 6;

      if (difficulty === "hard") {
        if (car32X < carX) car32X += 1.5;
        else if (car32X > carX) car32X -= 1.5;
        
        if (carExtraX < carX) carExtraX += 2;
        else if (carExtraX > carX) carExtraX -= 2;

        if (window.car50X < carX) window.car50X += 2.2;
        else if (window.car50X > carX) window.car50X -= 2.2;
      }

      car32Y += baseSpeed32 + level;
      if (car32Y > canvas.height) {
        car32Y = -160;
        car32X = Math.random() * (canvas.width - carWidth);
        score++;
      }

      carExtraY += baseSpeedExtra + level;
      if (carExtraY > canvas.height) {
        carExtraY = -160;
        carExtraX = Math.random() * (canvas.width - carWidth);
        score++;
      }

      if (difficulty === "hard") {
        if (currentCar !== "car50") {
          ctx.drawImage(car50Img, window.car50X, window.car50Y, carWidth, carHeight);
        }
        window.car50Y += 6 + level;
        if (window.car50Y > canvas.height) {
          window.car50Y = -160;
          window.car50X = Math.random() * (canvas.width - carWidth);
          score++;
        }
        if (currentCar !== "car50" && checkCollision(carX, carY, carWidth, carHeight, window.car50X, window.car50Y, carWidth, carHeight)) {
          endGame();
        }
      }

      if (score > 0 && score % 10 === 0) {
        level = Math.floor(score / 10) + 1;
      }

      ctx.fillStyle = "white";
      ctx.font = "bold 20px Arial";
      ctx.fillText("Score: " + score, 20, 40);
      ctx.fillText("Level: " + level, 20, 70);
      ctx.fillText("Difficulty: " + difficulty.toUpperCase(), 20, 100);

      let crashWith32 = (currentCar !== "car32" && checkCollision(carX, carY, carWidth, carHeight, car32X, car32Y, carWidth, carHeight));
      let crashWithExtra = (currentCar !== "carExtra" && checkCollision(carX, carY, carWidth, carHeight, carExtraX, carExtraY, carWidth, carHeight));

      if (crashWith32 || crashWithExtra) {
        endGame();
      }

      requestAnimationFrame(drawGame);
    }

    function endGame() {
      gameOver = true;
      bgMusic.pause();
      crashSound.play();
      releaseWakeLock(); // إطفاء ميزة منع الانطفاء عند الخسارة
      ingamePauseBtn.style.display = "none";
      alert("💥 Game Over!\nScore: " + score + "\nLevel: " + level);
      controlPanel.style.display = "block"; 
      pauseBtn.style.display = "none";
      restartBtn.style.display = "block";
    }

    document.onkeydown = (e) => {
      if (gameOver || paused) return;
      let moveStep = (difficulty === "easy") ? 25 : 20;
      if (e.key === "ArrowLeft" && carX > 0) carX -= moveStep;
      if (e.key === "ArrowRight" && carX < canvas.width - carWidth) carX += moveStep;
      if (e.key === "ArrowUp" && carY > 0) carY -= moveStep; 
      if (e.key === "ArrowDown" && carY < canvas.height - carHeight) carY += moveStep; 
    };

    function handleTouch(e) {
      if (gameOver || paused) return;
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      carX = (touch.clientX - rect.left) - carWidth / 2;
      carY = (touch.clientY - rect.top) - carHeight / 2;

      if (carX < 0) carX = 0;
      if (carX > canvas.width - carWidth) carX = canvas.width - carWidth;
      if (carY < 0) carY = 0;
      if (carY > canvas.height - carHeight) carY = canvas.height - carHeight;
    }

    canvas.addEventListener("touchstart", handleTouch, {passive: true});
    canvas.addEventListener("touchmove", (e) => {
      handleTouch(e);
      e.preventDefault(); 
    }, { passive: false });

    function togglePause() {
      paused = !paused;
      if (paused) {
        bgMusic.pause();
        releaseWakeLock(); // السماح للشاشة بالانطفاء إذا أوقف اللاعب اللعبة مؤقتاً
        controlPanel.style.display = "block";
        pauseBtn.style.display = "block";
        restartBtn.style.display = "block";
      } else {
        bgMusic.play();
        requestWakeLock(); // إعادة إضاءة الشاشة فوراً عند استئناف اللعب
        controlPanel.style.display = "none";
        drawGame();
      }
    }

    pauseBtn.onclick = togglePause;
    ingamePauseBtn.onclick = togglePause;

    restartBtn.onclick = () => {
      resetGame();
      bgMusic.play();
      requestWakeLock(); // تشغيل الإضاءة الدائمة عند إعادة التشغيل
      drawGame();
    };

    startBtn.onclick = () => {
      startScreen.style.display = "none";
      canvas.style.display = "block";
      resetGame();
      bgMusic.play();
      requestWakeLock(); // إبقاء الشاشة مضيئة فور الضغط على Start وبدء اللعبة
      drawGame();
    };

    // إعادة تفعيل النظام تلقائياً إذا خرج اللاعب من المتصفح وعاد إليه واللعبة تعمل
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && !paused && !gameOver) {
        await requestWakeLock();
      }
    });

    window.addEventListener("deviceorientation", (event) => {
      if (gameOver || paused) return;
      const tiltX = event.gamma; 
      const tiltY = event.beta;  
      let moveStep = (difficulty === "easy") ? 8 : 5;

      if (tiltX < -6 && carX > 0) carX -= moveStep;
      if (tiltX > 6 && carX < canvas.width - carWidth) carX += moveStep;
      if (tiltY < 40 && carY > 0) carY -= moveStep; 
      if (tiltY > 60 && carY < canvas.height - carHeight) carY += moveStep; 
    });
  </script>
</body>
</html>
